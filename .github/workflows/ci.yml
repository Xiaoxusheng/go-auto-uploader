name: Go CI/CD

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]

jobs:
  check:
    name: Vet & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Download deps
        run: go mod download

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./...

  build:
    name: Build Matrix
    needs: check
    runs-on: ubuntu-latest

    strategy:
      matrix:
        os: [linux, windows, darwin]
        arch: [amd64, arm64]
        exclude:
          - os: windows
            arch: arm64   # Go 对 windows arm64 支持不稳定，先排除

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Download deps
        run: go mod download

      # 检测 go.mod / go.sum 与代码是否一致，不一致直接失败，
      # 避免 CI 里静默改写依赖后再构建出与本地不符的产物。
      - name: Go mod tidy check
        run: go mod tidy -diff

      # 入口在 ./cmd/uploader，仓库根目录没有 .go 文件，
      # 必须显式指定包路径，否则报 "no Go files in ..."。
      - name: Build
        shell: bash
        run: |
          # 确定文件名
          BIN_NAME="uploader"
          if [ "${{ matrix.os }}" = "windows" ]; then
            BIN_NAME="uploader.exe"
          fi
          
          # 编译并注入版本号和时间
          CGO_ENABLED=0 GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} \
          go build -trimpath -ldflags "-w -s -X main.Version=${{ github.ref_name }} -X main.BuildTime=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
          -o "$BIN_NAME" ./cmd/uploader

          # 打包并生成 checksum
          PKG_NAME="uploader-${{ matrix.os }}-${{ matrix.arch }}.tar.gz"
          tar -czf "$PKG_NAME" "$BIN_NAME"
          sha256sum "$PKG_NAME" > "$PKG_NAME.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: uploader-${{ matrix.os }}-${{ matrix.arch }}
          path: uploader-*.tar.gz*

  release:
    name: Auto Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    # --- 修复 1：解决 403 Forbidden 权限报错 ---
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 必须完整历史才能生成 changelog

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          # --- 修复 2：将所有平台的产物合并平铺到同一个 dist 目录，避免嵌套过深 ---
          merge-multiple: true

      - name: Generate Changelog
        id: changelog
        shell: bash
        run: |
          PREV_TAG=$(git tag --sort=-creatordate | sed -n '2p')
          
          # --- 修复 3：解决 EOF 粘连报错问题，统一输出重定向 ---
          {
            echo "CHANGELOG<<EOF"
            if [ -z "$PREV_TAG" ]; then
              echo "Initial release 🎉"
            else
              git log $PREV_TAG..HEAD --pretty=format:"- %s (%h)"
              echo "" # 强制换行，确保 EOF 独占一行
            fi
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            ## 🚀 Release ${{ github.ref_name }}

            ### 📦 Binaries
            - linux / windows / macOS
            - amd64 / arm64

            ### 📝 Changelog
            ${{ env.CHANGELOG }}

            ### 🔐 Checksums
            sha256 files included
          files: |
            dist/*.tar.gz
            dist/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}