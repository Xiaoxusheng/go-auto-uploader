                    configForm.value.dirs = configDirsString.value.split(',').map(s => s.trim()).filter(s => s);
                    await api.put('/config', configForm.value);
                    window.uiNotify('success', {
                        title: '⚙️ 参数已生效',
                        content: '配置项已热更新',
                        duration: 5000
                    });
                    const now = new Date(), p2 = (n) => String(n).padStart(2, '0');
                    const stamp = `${p2(now.getMonth() + 1)}-${p2(now.getDate())} ${p2(now.getHours())}:${p2(now.getMinutes())}`;
                    lastConfigSave.value = stamp;
                    try { localStorage.setItem('lastConfigSaveAt', stamp); } catch (e) {}

                    if (originalConfigSnapshot.enableEncryption !== configForm.value.enableEncryption) {
                        Modal.info({
                            title: '安全配置已变更',
                            content: '您修改了通信层安全加密开关，系统将重载页面以重建安全隧道连接。',
                            onOk: () => {
                                window.location.reload();

                    configSaving.value = false;

            /**
             * 将冗长的原始流长字节计算切削成供人工识别判读查验的 MB 或 GB 数据尺度描述词缀
             */
            const formatSize = (bytes) => {
                if (!bytes) return '0 B';
                const k = 1024, sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
            };

            const formatSpeedRate = (bps) => formatSize(bps) + '/s';
            const formatSpeed = (bps) => formatSpeedRate(bps);

            const calculatePercent = (up, tot) => (!tot ? 0 : Number((up / tot).toFixed(2)));

            const formatDurationSeconds = (sec) => {
                if (!sec && sec !== 0) return '-';
                if (sec === 0) return '< 1s';
                const m = Math.floor(sec / 60);
                const s = sec % 60;
                return m > 0 ? `${m}m ${s}s` : `${s}s`;
            };

            // Uptime 紧凑展示（设计稿："3天 14:22" / "14:22"）
            const uptimeText = computed(() => {
                const seconds = systemStatus.uptime || 0;
                if (seconds <= 0) return '0 分钟';
                const d = Math.floor(seconds / 86400);
                const h = Math.floor((seconds % 86400) / 3600);
                const m = Math.floor((seconds % 3600) / 60);
                if (d > 0) return `${d}天 ${h}:${String(m).padStart(2, '0')}`;
                if (h > 0) return `${h}:${String(m).padStart(2, '0')}`;
                return `${m} 分钟`;
            });

            const formatDuration = (seconds) => {
                if (!seconds || seconds < 0) return '0h 0m';
                const d = Math.floor(seconds / 86400);
                const h = Math.floor((seconds % 86400) / 3600);
                const m = Math.floor((seconds % 3600) / 60);
                return d > 0 ? `${d}d ${h}h ${m}m` : `${h}h ${m}m`;
            };

            const getElapsedTime = (startTime) => {
                if (!startTime) return '0s';
                return formatDurationSeconds(Math.floor((clientTime.value - startTime) / 1000));
            };

            const formatStatusText = (status) => {
                if (!status) return '未知';
                const lower = String(status).toLowerCase();
                if (lower.includes('success(秒传)')) return '成功 (秒传)';
                if (lower.includes('success')) return '成功';
                if (lower.includes('fail')) return '失败';
                if (lower === 'uploading') return '处理中';
                if (lower === 'waiting') return '等待中';
                return status;
            };

            const getLogLevelColor = (level) => ({
                'info': '#4ade80',
                'error': '#f87171',
                'warn': '#fbbf24',
                'success': '#34d399'
            }[level] || 'var(--t3)');

            /**
             * 登入认证无误系统界面唤起前做大规模初探探测信息载入准备功能
             */
            const initDashboard = () => {
                fetchStatus();
                fetchQueue();
                fetchLiveTasks();
                fetchHistory();
                fetchLogs();
                fetchConfig();
                setTimeout(() => {
                    connectWS();
                }, 1000);
                if (pollingTimer) clearInterval(pollingTimer);
                pollingTimer = setInterval(() => {
                    clientTime.value = Date.now();
                }, 1000);
            };

            /**
             * 退离体系后解绑卸除销毁前端内缓存一切定时与挂靠连接及 ECharts 画布占据耗时的清除收尾总系统
             */
            const cleanUp = () => {
                if (pollingTimer) clearInterval(pollingTimer);
                if (pingTimer) clearInterval(pingTimer);
                pollingTimer = null;
                pingTimer = null;
                if (ws) {
                    ws.onclose = null;
                    ws.close();
                    ws = null;
                }
                if (chartInstance) {
                    chartInstance.dispose();
                    chartInstance = null;
                }
                if (trendChartInstance) {
                    trendChartInstance.dispose();
                    trendChartInstance = null;
                }

                // 登出后清空内存中的业务数据，避免换账号登录时闪现上一个会话的内容
                liveTasks.value = [];
                builtinTasks.value = [];
                streamers.value = [];
                activeRecordingStreamers.value = [];
                statsData.trend = [];
                statsData.rank = [];
                Object.assign(queueStatus, {waiting: 0, uploading: 0, success: 0, failed: 0, retrying: 0});
                Object.assign(trafficMetrics, {speed: 0, time: 0});
                Object.assign(systemStatus, {
                    running: false, uptime: 0, workers: 0, rate: 0, dirs: [],
                    dynamicInterval: 0, nextScanTime: 0, scanningInterval: 0, diskFree: 0, ffmpegMem: 0
                });
                wsStats.msgCount = 0;
                window.lastStatsStr = '';
                window.lastStreamersStr = '';
            };

            onMounted(() => {

                document.addEventListener('compositionstart', handleCompositionGuard, true);
                document.addEventListener('compositionend', handleCompositionGuard, true);

                document.addEventListener('visibilitychange', () => {
                    // 【性能优化核心拦截点】利用原生 API 刷新全局挂起状态拦截网络操作
                    isPageVisible.value = !document.hidden;

                    if (document.visibilityState === 'visible' && isLoggedIn.value) {

                        }

            return {
                isPageVisible,

                systemStatus, queueStatus, liveTasks, uploadingTasks, completedTasks, uploadingCount, waitingCount,
                liveTotalSize, completedPage, completedPageSize, completedPaged,
                control, historyQuery, historyData, fetchHistory, onPageChange,
                logQuery, logData, logExportLimit, fetchLogs, downloadLogs, configForm, configDirsString,
                configSaving, lastConfigSave, fetchConfig, saveConfig, streamers, newStreamer, activeStreamersCount, fetchStreamers,
                saveStreamers, addStreamer, confirmRemoveStreamer, removeStreamer, activeRecordingStreamers, onlineStreamersCount,
                pagedStreamers, streamerPage, streamersPages, filteredStreamers,
                showBatchAddModal, batchAddText, batchAddLoading, handleBatchAdd, cookiesForm, cookiesLoading, extCookiePlatforms,
                fetchCookies, saveCookies, engineView, dirView, wsText, cryptoOn, fmtClock, nextScanClock,
                rankTotal, queueTotal, diskWarnBytes, pendingControl, recorderStatus, recorderControlLoading, showLogsModal,
                recorderLogsContent, recorderLogsLines, dockerLineClass, dockerLogsRef, fetchRecorderStatus, controlRecorder, fetchRecorderLogs,
                openLogsModal, formatSize, formatSpeed, calculatePercent, formatDuration, formatDurationSeconds,
                getElapsedTime, getLogLevelColor, fetchLiveTasks, formatStatusText, uptimeText,
                streamerSearchQuery, trafficMetrics, statsData, calculateRankPercent,
                builtinSearchQuery, showBuiltinSettingsModal, showBuiltinBatchModal, builtinSettingsTab,
                builtinViewMode, builtinStatusFilter, builtinPlatformFilter, isBuiltinLiveStatusJS,
                builtinPlatformLabel, builtinQualityText, builtinQualityShort,
