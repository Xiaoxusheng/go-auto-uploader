<script>
    let _cryptoKey = null;
    let _sessionId = null;
    let _aesKeyBytes = null;
    let securityPromise = null;

    /**
     * 解析并导入后端传来的 RSA 公钥 (SPKI 格式)
     * @param {string} base64Key Base64编码的RSA公钥
     * @returns {Promise<CryptoKey>} 返回可用于加密的 Web Crypto API 密钥对象
     */
    async function importRSAPublicKey(base64Key) {
        const binaryDer = window.atob(base64Key);
        const bytes = new Uint8Array(binaryDer.length);
        for (let i = 0; i < binaryDer.length; i++) {
            bytes[i] = binaryDer.charCodeAt(i);
        }
        return await crypto.subtle.importKey(
            "spki",
            bytes.buffer,
            {name: "RSA-OAEP", hash: "SHA-256"},
            false,
            ["encrypt"]
        );
    }

    /**
     * 核心安全初始化：与服务端进行非对称握手并申请专属 AES 加密隧道
     * @returns {Promise<void>} 握手完成的 Promise 信号
     */
    async function initSecurity() {
        if (securityPromise) return securityPromise;
        securityPromise = (async () => {
            try {
                // 1. 从服务器拉取随机生成的 RSA 公钥
                const res = await fetch('/api/v1/sec/pubkey');
                const pubKeyData = await res.json();

                // 将后端返回的 enabled 状态保存到前端全局变量
                window._encryptionEnabled = pubKeyData.data.enabled;

                if (!window._encryptionEnabled) {
                    console.log("🔓 [SEC] 后端已关闭传输加密，切换为明文直连模式");
                    _sessionId = "plaintext-" + Date.now();
                    return;
                }

                const rsaPubKey = await importRSAPublicKey(pubKeyData.data.pubkey);

                // 2. 在浏览器本地随机生成 32 字节的高强度 AES-256 密钥
                _aesKeyBytes = crypto.getRandomValues(new Uint8Array(32));
                _cryptoKey = await crypto.subtle.importKey("raw", _aesKeyBytes, {name: "AES-GCM"}, false, ["encrypt", "decrypt"]);

                // 3. 使用 RSA-OAEP 公钥加密该 AES 密钥
                const encryptedAesKeyBuf = await crypto.subtle.encrypt({name: "RSA-OAEP"}, rsaPubKey, _aesKeyBytes);
                const encryptedAesKeyB64 = window.btoa(String.fromCharCode(...new Uint8Array(encryptedAesKeyBuf)));

                // 4. 将加密后的 AES 密钥发送给后端，换取本会话独有的 Session ID
                const exRes = await fetch('/api/v1/sec/exchange', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({enc_key: encryptedAesKeyB64})
                });
                const exData = await exRes.json();
                _sessionId = exData.data.session_id;
                console.log("🛡️ [SEC] RSA+AES 动态密钥安全隧道建立完成!");
            } catch (e) {
                console.error("安全隧道建立失败:", e);
                ArcoVue.Message.error('无法建立安全通信信道，请刷新页面重试');
            }
        })();
        return securityPromise;
    }

    /**
     * 获取 AES 密钥，若未初始化隧道则自动触发安全握手协议
     * @returns {Promise<CryptoKey|null>} 会话专属 AES 密钥
     */
    async function getCryptoKey() {
        if (!_cryptoKey && window._encryptionEnabled) await initSecurity();
        return _cryptoKey;
    }

    /**
     * AES-256-GCM 动态载荷加密函数：生成密文供网络层安全传输
     * @param {string} plaintext 准备加密的明文 JSON 字符串
     * @returns {Promise<string>} Base64 编码的密文结果
     */
    async function encryptPayload(plaintext) {
        const key = await getCryptoKey();
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const encoded = new TextEncoder().encode(plaintext);
        const ciphertextBuffer = await crypto.subtle.encrypt({name: "AES-GCM", iv: iv}, key, encoded);
        const ciphertext = new Uint8Array(ciphertextBuffer);
        const combined = new Uint8Array(iv.length + ciphertext.length);
        combined.set(iv);
        combined.set(ciphertext, iv.length);

        let binary = '';
        for (let i = 0; i < combined.byteLength; i++) {
            binary += String.fromCharCode(combined[i]);
        }
        return window.btoa(binary);
    }

    /**
     * AES-256-GCM 动态载荷解密函数：对服务端下发的加密报文进行解密
     * @param {string} base64Str Base64 编码的密文载荷
     * @returns {Promise<string>} 解密后的原始明文字符串
     */
    async function decryptPayload(base64Str) {
        const key = await getCryptoKey();
        const binary = window.atob(base64Str);
        const combined = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
            combined[i] = binary.charCodeAt(i);
        }
        const iv = combined.slice(0, 12);
        const ciphertext = combined.slice(12);
        const decryptedBuffer = await crypto.subtle.decrypt({name: "AES-GCM", iv: iv}, key, ciphertext);
        return new TextDecoder().decode(decryptedBuffer);
    }
</script>

<script>
    const {createApp, ref, reactive, onMounted, onUnmounted, computed, watch, nextTick} = Vue;
    const {Message, Modal, Notification} = ArcoVue;

    const api = axios.create({baseURL: '/api/v1', timeout: 10000});

    /**
     * Axios 响应拦截器：自动拦截后端报文，触发专属 AES 密钥解密，并统一下发错误反馈
     */
    api.interceptors.response.use(
        async res => {
            let data = res.data;
            if (window._encryptionEnabled && data && data.encrypted) {
                try {
                    const decryptedStr = await decryptPayload(data.encrypted);
                    data = JSON.parse(decryptedStr);
                } catch (e) {
                    Message.error('动态解密失败，数据可能被劫持或密钥过期');
                    return Promise.reject(new Error('Decrypt failed'));
                }
            }
            if (data.code !== 200) {
                // 如果后端告知 Session 不合法/过期，清空重连
                if (data.code === 401 && data.message === 'Session Invalid') {
                    _sessionId = null;
                    _cryptoKey = null;
                    securityPromise = null;
                    window.location.reload();
                }
                Message.error(data.message || '请求失败');
                return Promise.reject(new Error(data.message));
            }
            return data;
        },
        async err => {
            if (err.response && err.response.status === 401) {
                if (err.response.data && err.response.data.message === 'Session Invalid') {
                    _sessionId = null;
                    _cryptoKey = null;
                    securityPromise = null;
                } else {
                    localStorage.removeItem('upload_system_token');
                }
                window.location.reload();
            }
            if (window._encryptionEnabled && err.response && err.response.data && err.response.data.encrypted) {
                try {
                    const decryptedStr = await decryptPayload(err.response.data.encrypted);
                    err.response.data = JSON.parse(decryptedStr);
                } catch (e) {
                }
            }
            Message.error(err.response?.data?.message || err.message || '网络错误');
            return Promise.reject(err);
        }
    );

     * Axios 请求拦截器：确保握手完成后携带专属 SessionID，并自动对载荷进行安全封装密文
     */
    api.interceptors.request.use(async config => {
        if (!_sessionId) await initSecurity();
        config.headers['X-Session-Id'] = _sessionId;

        const token = localStorage.getItem('upload_system_token');
        if (token) config.headers['Authorization'] = `Bearer ${token}`;

        if (config.data && !(config.data instanceof FormData)) {
            if (window._encryptionEnabled) {
                const rawJson = JSON.stringify(config.data);
                const encryptedStr = await encryptPayload(rawJson);
                config.data = {encrypted: encryptedStr};
                config.headers['X-Encryption-Mode'] = 'AES-256-GCM';
            } else {
                config.headers['X-Encryption-Mode'] = 'Plaintext';
            }
        }
        return config;

            const builtinPageSize = ref(builtinPageSizeFor(builtinViewMode.value));
            watch(builtinViewMode, (v) => {
                try { localStorage.setItem('builtinViewMode', v); } catch (e) {}
                builtinPageSize.value = builtinPageSizeFor(v);
                builtinCurrentPage.value = 1;
            });
            const builtinStatusFilter = ref('all');
            const builtinPlatformFilter = ref('all');
            const builtinSortMode = ref('live');
            watch([builtinStatusFilter, builtinPlatformFilter, builtinSortMode], () => {
                builtinCurrentPage.value = 1;
            });

            const builtinPlatformLabel = (p) =>
                ({Douyin: '抖音', Kuaishou: '快手', Bilibili: 'B站', Twitch: 'Twitch', Soop: 'SOOP'})[p] || p || '未知';
            // 仅使用当前图标包中真实存在的图标（icon-tv / icon-globe 并未注册，原映射会静默丢失图标）
            const builtinPlatformIcon = (p) =>
                ({Douyin: 'icon-music', Kuaishou: 'icon-video-camera', Bilibili: 'icon-live-broadcast', Twitch: 'icon-play-circle', Soop: 'icon-public'})[p] || 'icon-tag';
            // 浅色 tag（列表用）：Arco 预设色，浅底彩字
            const builtinPlatformTagColor = (p) =>
                ({Douyin: 'red', Kuaishou: 'orange', Bilibili: 'magenta', Twitch: 'purple', Soop: 'green'})[p] || 'gray';
            // 实心样式（封面角标用）：图片上保证可读
            const builtinPlatformTagStyle = (p) => {
                const c = {Douyin: '#FE2C55', Kuaishou: '#FF7D00', Bilibili: '#FB7299', Twitch: '#9146FF', Soop: '#00B42A'}[p] || '#86909C';
                return {background: c, color: '#fff', border: 'none'};
            };
            const builtinQualityText = (q) =>
                ({uhd: '蓝光/超清', hd: '高清', sd: '标清'})[q] || '默认画质';
            // 单主播切片时长的生效文案：0/空 = 跟随引擎设置里的全局自动分片时长
            const builtinSegmentText = (v) => {
                const n = Number(v) > 0 ? Number(v) : (Number(builtinSettings.value.segment_time) || 0);
                return n > 0 ? `${n} 分钟` : '不切片（整场单文件）';
            };
            const builtinQualityShort = (q) =>
                ({uhd: '超清', hd: '高清', sd: '标清'})[q] || '默认画质';
            const builtinLiveTagColor = (t) =>
                isBuiltinLiveStatusJS(t.status) ? 'green' : (t.is_paused ? 'orange' : '');
            const builtinLiveTagIcon = (t) =>
                isBuiltinLiveStatusJS(t.status) ? 'icon-play-circle-fill' : 'icon-pause-circle';

            // ========== 状态视觉系统：后端状态字符串 → 视图元数据（Dot / Badge / 文案） ==========
            const builtinStatusView = (t) => {
                if (!t) return {key: 'offline', badge: 'OFFLINE', label: '未知', pulse: false};
                if (t.is_paused) return {key: 'paused', badge: 'PAUSED', label: '已暂停', pulse: false};
                switch (t.status) {
                    case '录制中':
                        return {key: 'rec', badge: 'REC', label: '正在录制', pulse: true};
                    case '截屏中':
                        return {key: 'live', badge: 'LIVE', label: '正在截屏', pulse: true};
                    case '断流缓冲中':
                        return {key: 'buffer', badge: 'WAIT', label: '断流缓冲中', pulse: true};
                    case '分段续录中':
                        return {key: 'rec', badge: 'REC', label: '分段续录中', pulse: true};
                    case '非录制时段':
                        return {key: 'paused', badge: 'WAIT', label: '非录制时段', pulse: false};
                    case '检测异常等待中':
                        return {key: 'error', badge: 'ERROR', label: '检测异常', pulse: true};
                    case '配置重载中':
                        return {key: 'init', badge: 'INIT', label: '配置重载', pulse: true};
                    case '初始化中':
                        return {key: 'init', badge: 'INIT', label: '等待抓取', pulse: true};
                    case '监控中':
                        // 后端「监控中」= 正在轮询探测、当前未录制。它以前落到 default 被显示成
                        // 「未开播」，于是「实际在录却显示未开播」这种误导就出现了，这里单独给一档。
                        return {key: 'idle', badge: 'IDLE', label: '监控中', pulse: false};
                    default:
                        return {key: 'offline', badge: 'OFFLINE', label: '未开播', pulse: false};
                }
            };
            // 卡片正文第二行：录制/截屏任务展示为「REC · 02:41」式的技术化时长
            const builtinStatusLine = (t) => {
                const view = builtinStatusView(t);
                if (view.key === 'rec' || view.key === 'live') {
                    return `${view.badge} · ${fmtRecDuration(t.duration)}`;
                }
                return view.label;
            };
            // "01小时02分03秒" → "01:02:03"；"02分41秒" → "02:41"
            const fmtRecDuration = (s) => {
                if (!s || s === '-') return '--:--';
                const m = String(s).match(/(?:(\d+)小时)?(?:(\d+)分)?(?:(\d+)秒)?/);
                if (!m) return String(s);
                const pad = (x) => String(x || 0).padStart(2, '0');
                return m[1] ? `${pad(m[1])}:${pad(m[2])}:${pad(m[3])}` : `${pad(m[2])}:${pad(m[3])}`;
            };
            // "570.65 MB" → 字节数（用于按占用排序）
            const parseBuiltinSizeBytes = (str) => {
                if (!str) return 0;
                const m = String(str).match(/([\d.]+)\s*(B|KB|MB|GB|TB)/i);
                if (!m) return 0;
                const units = {B: 1, KB: 1024, MB: 1024 ** 2, GB: 1024 ** 3, TB: 1024 ** 4};
                return parseFloat(m[1]) * (units[m[2].toUpperCase()] || 1);
            };

            const sortedBuiltinTasks = computed(() => {
                try {
                    let list = [...(builtinTasks.value || [])];
                    if (builtinSearchQuery.value) {
                        const q = String(builtinSearchQuery.value || '').trim().toLowerCase();
                        if (q) {
                            list = list.filter(t => {
                                const nameMatch = t && t.anchor_name ? String(t.anchor_name).toLowerCase().includes(q) : false;
                                const roomMatch = t && t.room_id ? String(t.room_id).toLowerCase().includes(q) : false;
                                return nameMatch || roomMatch;
                            });
                        }
                    }
                    if (builtinStatusFilter.value === 'live') {
                        list = list.filter(t => t && isBuiltinLiveStatusJS(t.status));
                    } else if (builtinStatusFilter.value === 'offline') {
                        list = list.filter(t => t && !isBuiltinLiveStatusJS(t.status));
                    }
                    if (builtinPlatformFilter.value !== 'all') {
                        list = list.filter(t => t && t.platform === builtinPlatformFilter.value);
                    }
                    if (builtinSortMode.value === 'name') {
                        list.sort((a, b) => String(a?.anchor_name || '').localeCompare(String(b?.anchor_name || ''), 'zh-Hans-CN'));
                    } else if (builtinSortMode.value === 'size') {
                        list.sort((a, b) => parseBuiltinSizeBytes(b?.file_size) - parseBuiltinSizeBytes(a?.file_size));
                    } else {
                        list.sort((a, b) => {
                            const isARecording = (a && isBuiltinLiveStatusJS(a.status)) ? 1 : 0;
                            const isBRecording = (b && isBuiltinLiveStatusJS(b.status)) ? 1 : 0;
                            return isBRecording - isARecording;
                        });
                    }
                    return list;
                } catch (e) {
                    console.error("内置引擎搜索/排序错误:", e);
                    return builtinTasks.value || [];
                }
            });

            const paginatedBuiltinTasks = computed(() => {
                const start = (builtinCurrentPage.value - 1) * builtinPageSize.value;
                return sortedBuiltinTasks.value.slice(start, start + builtinPageSize.value);
            });
            watch(builtinSearchQuery, () => {
                builtinCurrentPage.value = 1;
            });

            const builtinActiveCount = computed(() => builtinTasks.value.filter(t => !t.is_paused).length);
            const builtinRecordingCount = computed(() => builtinTasks.value.filter(t => isBuiltinLiveStatusJS(t.status)).length);
            const builtinPausedCount = computed(() => builtinTasks.value.filter(t => t.is_paused).length);
            const isAllBuiltinActive = computed(() => builtinTasks.value.length > 0 && builtinTasks.value.some(t => !t.is_paused));
            const builtinPlatformCount = computed(() => new Set((builtinTasks.value || []).map(t => t.platform).filter(Boolean)).size);

            // 引擎数据链路：WS 最近一次推送 builtinTasks 的时间（依赖 clientTime 每秒刷新显示）
            const builtinLastSync = ref(0);
            const builtinSyncText = computed(() => {
                if (!builtinLastSync.value) return '等待推送…';
                void clientTime.value;
                return new Date(builtinLastSync.value).toLocaleTimeString('zh-CN', {hour12: false});
            });

            // 快速添加的行内反馈（成功在输入框旁，失败在输入区下方），不完全依赖 Toast
            const builtinAddFeedback = ref(null);
            let builtinAddFeedbackTimer = null;
            const setBuiltinAddFeedback = (type, text) => {
                builtinAddFeedback.value = {type, text};
                if (builtinAddFeedbackTimer) clearTimeout(builtinAddFeedbackTimer);
                if (type === 'success') {
                    builtinAddFeedbackTimer = setTimeout(() => {
                        builtinAddFeedback.value = null;
                    }, 3000);
                }
            };

            // 任务详情抽屉：绑定任务引用，WS 原地合并字段时抽屉数据同步更新
            const recDrawer = reactive({visible: false, record: null});
            // 单主播截图间隔编辑态：null = 跟随全局（与后端 0 值语义对应）
            const shotIntervalEdit = ref(null);
            const shotIntervalSaving = ref(false);
            // 单主播水印覆盖编辑态：0=跟随全局 1=强制开 2=强制关
            const watermarkEdit = ref(0);
            const watermarkSaving = ref(false);
            // 单主播高光切片覆盖编辑态：0=跟随全局 1=强制开 2=强制关
            const highlightEdit = ref(0);
            const highlightSaving = ref(false);
            // 单主播「只传高光」编辑态：0=跟随全局 1=只传高光 2=原片也传
            const highlightOnlyEdit = ref(0);
            const highlightOnlySaving = ref(false);
            // 单主播画质覆盖编辑态：'' = 跟随全局（与后端空串语义对应）
            const qualityEdit = ref('');
            const qualitySaving = ref(false);
            // 单主播最长录制时长编辑态（分钟）：null = 不限制（与后端 0 值语义对应）
            const maxDurationEdit = ref(null);
            const maxDurationSaving = ref(false);
            // 单主播切片时长编辑态（分钟）：null = 跟随全局「自动分片时长」
            const segmentTimeEdit = ref(null);
            const segmentTimeSaving = ref(false);
            // 单主播录制时段编辑态：时间选择框（'' = 全天可录；结束 00:00 与后端 24:00 语义互转）
            const windowStart = ref('');
            const windowEnd = ref('');
            const windowSaving = ref(false);
            // 归一化时间选择器的值：兼容字符串 "HH:mm[:ss]" 与 Date 对象，输出 "HH:mm"
            const normClock = (v) => {
                if (!v) return '';
                if (v instanceof Date) {
                    return String(v.getHours()).padStart(2, '0') + ':' + String(v.getMinutes()).padStart(2, '0');
                }
                const parts = String(v).trim().split(':');
                if (parts.length < 2) return String(v).trim();
                return parts[0].padStart(2, '0') + ':' + parts[1].padStart(2, '0');
            };
            // 名单行时段 → 选择框：结束 "24:00" 显示为 "00:00"
            const windowToPickers = (w) => {
                const val = String(w || '').trim();
                if (!val || !val.includes('-')) {
                    windowStart.value = '';
                    windowEnd.value = '';
                    return;
                }
                const [s, e] = val.split('-');
                windowStart.value = normClock(s);
                windowEnd.value = e.trim().startsWith('24') ? '00:00' : normClock(e);
            };
            const openRecDrawer = (record) => {
                if (!record) return;
                recDrawer.record = record;
                shotIntervalEdit.value = Number(record.shot_interval) > 0 ? Number(record.shot_interval) : null;
                const wm = Number(record.watermark);
                watermarkEdit.value = (wm === 1 || wm === 2) ? wm : 0;
                const hl = Number(record.highlight);
                highlightEdit.value = (hl === 1 || hl === 2) ? hl : 0;
                const hlo = Number(record.highlight_only);
                highlightOnlyEdit.value = (hlo === 1 || hlo === 2) ? hlo : 0;
                qualityEdit.value = ['uhd', 'hd', 'sd'].includes(record.quality_override) ? record.quality_override : '';
                maxDurationEdit.value = Number(record.max_duration) > 0 ? Number(record.max_duration) : null;
                segmentTimeEdit.value = Number(record.segment_time) > 0 ? Number(record.segment_time) : null;
                windowToPickers(record.window);
                recDrawer.visible = true;
                if (!builtinSettings.value.save_path) {
                    fetchBuiltinConfig();
                }
            };

            /**
             * 保存当前主播的专属截图间隔（0/清空 = 跟随全局）。
             * 间隔由后端抽帧循环每轮热读取，改完即生效，不会中断录制。
             */
            const saveBuiltinShotInterval = async () => {
                const record = recDrawer.record;
                if (!record) return;
                const val = shotIntervalEdit.value === null || shotIntervalEdit.value === undefined
                    ? 0 : Math.max(0, Math.floor(Number(shotIntervalEdit.value) || 0));
                shotIntervalSaving.value = true;
                try {
                    await api.post('/builtin_recorder/control', {
                        action: 'set_flags',
                        platform: record.platform,
                        room_id: record.room_id,
                        shot_interval: val
                    });
                    record.shot_interval = val;
                    shotIntervalEdit.value = val > 0 ? val : null;
                    Message.success(val > 0 ? `该主播截图间隔已设为 ${val} 秒，立即生效` : '已恢复跟随全局截图间隔');
                } catch (e) {
                    Message.error('截图间隔保存失败');
                } finally {
                    shotIntervalSaving.value = false;
                }
            };

            /**
             * 保存当前主播的水印覆盖（0=跟随全局 1=强制开 2=强制关）。
             * 视频水印只在 ffmpeg 启动时生效，后端会按需自动重开录制会话。
             */
            const saveBuiltinWatermark = async () => {
                const record = recDrawer.record;
                if (!record) return;
                const val = Number(watermarkEdit.value) === 1 || Number(watermarkEdit.value) === 2
                    ? Number(watermarkEdit.value) : 0;
                watermarkSaving.value = true;
                try {
                    await api.post('/builtin_recorder/control', {
                        action: 'set_flags',
                        platform: record.platform,
                        room_id: record.room_id,
                        watermark: val
                    });
                    record.watermark = val;
                    const label = val === 1 ? '已强制开启该主播水印' : val === 2 ? '已强制关闭该主播水印' : '该主播水印已恢复跟随全局';
                    Message.success(label + '（录制中的会话将自动按新设置重开）');
                } catch (e) {
                    Message.error('水印设置保存失败');
                } finally {
                    watermarkSaving.value = false;
                }
            };

            /**
             * 保存当前主播的高光切片覆盖（0=跟随全局 1=强制开 2=强制关）。
             * 高光是离线后处理，改完只影响后续落盘的切片，不会中断录制。
             */
            const saveBuiltinHighlight = async () => {
                const record = recDrawer.record;
                if (!record) return;
                const val = Number(highlightEdit.value) === 1 || Number(highlightEdit.value) === 2
                    ? Number(highlightEdit.value) : 0;
                highlightSaving.value = true;
                try {
                    await api.post('/builtin_recorder/control', {
                        action: 'set_flags',
                        platform: record.platform,
                        room_id: record.room_id,
                        highlight: val
                    });
                    record.highlight = val;
                    const label = val === 1 ? '已强制开启该主播高光切片'
                        : val === 2 ? '已强制关闭该主播高光切片' : '该主播高光切片已恢复跟随全局';
                    Message.success(label);
                } catch (e) {
                    Message.error('高光设置保存失败');
                } finally {
                    highlightSaving.value = false;
                }
            };

            /**
             * 保存当前主播的「只传高光」覆盖（0=跟随全局 1=只传高光 2=原片也传）。
             * 开启后原片保留在本地不上传，远端只收高光片段。
             */
            const saveBuiltinHighlightOnly = async () => {
                const record = recDrawer.record;
                if (!record) return;
                const val = Number(highlightOnlyEdit.value) === 1 || Number(highlightOnlyEdit.value) === 2
                    ? Number(highlightOnlyEdit.value) : 0;
                highlightOnlySaving.value = true;
                try {
                    await api.post('/builtin_recorder/control', {
                        action: 'set_flags',
                        platform: record.platform,
                        room_id: record.room_id,
                        highlight_only: val
                    });
                    record.highlight_only = val;
                    const label = val === 1 ? '该主播已设为只上传高光（原片不再上传）'
                        : val === 2 ? '该主播原片与高光都会上传' : '该主播上传策略已恢复跟随全局';
                    Message.success(label);
                } catch (e) {
                    Message.error('上传策略保存失败');
                } finally {
                    highlightOnlySaving.value = false;
                }
            };

            /**
             * 保存当前主播的画质覆盖（'' = 跟随全局）。
             * 拉流画质只在会话启动时确定，后端会自动重开录制中的会话按新画质续录。
             */
            const saveBuiltinQuality = async () => {
                const record = recDrawer.record;
                if (!record) return;
                const val = ['uhd', 'hd', 'sd'].includes(qualityEdit.value) ? qualityEdit.value : '';
                qualitySaving.value = true;
                try {
                    await api.post('/builtin_recorder/control', {
                        action: 'set_flags',
                        platform: record.platform,
                        room_id: record.room_id,
                        quality: val
                    });
                    record.quality_override = val;
                    const label = val === '' ? '该主播画质已恢复跟随全局'
                        : `该主播画质已固定为 ${builtinQualityText(val)}`;
                    Message.success(label + '（录制中的会话将自动按新画质重开）');
                } catch (e) {
                    Message.error('画质设置保存失败');
                } finally {
                    qualitySaving.value = false;
                }
            };

            /**
             * 保存当前主播的专属切片时长（0/清空 = 跟随全局「自动分片时长」）。
             * 切片由 ffmpeg 原生 -segment_time 完成，只在进程启动时生效，
             * 因此录制中修改会按新配置重开一次会话（不误报下播、不丢内容）。
             */
            const saveBuiltinSegmentTime = async () => {
                const record = recDrawer.record;
                if (!record) return;
                const val = segmentTimeEdit.value === null || segmentTimeEdit.value === undefined
                    ? 0 : Math.max(0, Math.floor(Number(segmentTimeEdit.value) || 0));
                segmentTimeSaving.value = true;
                try {
                    await api.post('/builtin_recorder/control', {
                        action: 'set_flags',
                        platform: record.platform,
                        room_id: record.room_id,
                        segment_time: val
                    });
                    record.segment_time = val;
                    segmentTimeEdit.value = val > 0 ? val : null;
                    Message.success(val > 0
                        ? `该主播切片时长已设为 ${val} 分钟（录制中的会话将自动重开一次）`
                        : '该主播切片时长已恢复跟随全局');
                } catch (e) {
                    Message.error('切片时长保存失败');
                } finally {
                    segmentTimeSaving.value = false;
                }
            };

            /**
             * 保存当前主播的单场最长录制时长（0/清空 = 不限制）。
             * 录制循环每 5 秒热读取该值，改小立即收尾、改大/清零立即解除，不会中断录制。
             */
            const saveBuiltinMaxDuration = async () => {
                const record = recDrawer.record;
                if (!record) return;
                const val = maxDurationEdit.value === null || maxDurationEdit.value === undefined
                    ? 0 : Math.max(0, Math.floor(Number(maxDurationEdit.value) || 0));
                maxDurationSaving.value = true;
                try {
                    await api.post('/builtin_recorder/control', {
                        action: 'set_flags',
                        platform: record.platform,
                        room_id: record.room_id,
                        max_duration: val
                    });
                    record.max_duration = val;
                    maxDurationEdit.value = val > 0 ? val : null;
                    Message.success(val > 0 ? `该主播单场最长录制时长已设为 ${val} 分钟，立即生效` : '该主播录制时长已恢复不限制');
                } catch (e) {
                    Message.error('录制时长保存失败');
                } finally {
                    maxDurationSaving.value = false;
                }
            };

            /**
             * 保存当前主播的定时录制时段（两个选择框全空 = 全天可录）。
             * 窗口由监控循环与录制巡检每轮热读取：窗口外只探测不拉流，
             * 录制中跨出窗口会优雅收尾，窗口再次打开后自动续录。
             */
            const saveBuiltinWindow = async () => {
                const record = recDrawer.record;
                if (!record) return;
                const s = normClock(windowStart.value);
                const e = normClock(windowEnd.value);
                let val = '';
                if (s && e) {
                    if (s === e) {
                        Message.info('起止时间相同，已按全天可录处理');
                    } else {
                        // 结束 00:00 即当天午夜，按后端约定的 24:00 语义存储
                        val = s + '-' + (e === '00:00' ? '24:00' : e);
                    }
                } else if (s || e) {
                    Message.warning('请同时选择开始与结束时间；全部清空表示全天可录');
                    return;
                }
                windowSaving.value = true;
                try {
                    await api.post('/builtin_recorder/control', {
                        action: 'set_flags',
                        platform: record.platform,
                        room_id: record.room_id,
                        window: val
                    });
                    record.window = val;
                    windowToPickers(val);
                    Message.success(val ? `该主播录制时段已设为 ${val}（服务器本地时间），即时生效` : '该主播已恢复全天可录');
                } catch (err) {
                    Message.error('录制时段保存失败');
                } finally {
                    windowSaving.value = false;
                }
            };

            /**
             * 截屏开关的悬浮提示：带单主播间隔时展示生效值
             */
            const shotToggleTip = (record) => {
                const n = record && Number(record.shot_interval) > 0 ? Number(record.shot_interval) : 0;
                return n > 0
                    ? `截屏开关：每 ${n} 秒保存一张截图（本主播专属间隔）`
                    : '截屏开关：定期保存直播画面截图；间隔跟随全局，可在任务详情里单独设置';
            };
            const recDrawerView = computed(() => builtinStatusView(recDrawer.record));

            // 上传状态推导（纯前端聚合，不改 WS 协议）：
            // 内置引擎录制文件名为「主播名_时间戳.ts」，用文件名匹配全局上传队列 liveTasks
            const builtinUploadTaskKeyOf = (t) => (t ? String(t.platform || '') + '_' + String(t.room_id || '') : '');
            const builtinUploadMap = computed(() => {
                const map = new Map();
                const tasks = builtinTasks.value || [];
                const ups = liveTasks.value || [];
                if (!tasks.length || !ups.length) return map;
                for (const t of tasks) {
                    const name = t.anchor_name && t.anchor_name !== t.room_id ? String(t.anchor_name) : '';
                    const rid = t.room_id ? String(t.room_id) : '';
                    if (!name && rid.length < 4) continue;
                    let best = null;
                    for (const u of ups) {
                        const fn = String(u && u.filename || '');
                        if (!fn) continue;
                        if ((name && fn.includes(name)) || (rid.length >= 4 && fn.includes(rid))) {
                            if (!best || (u.startTime || 0) >= (best.startTime || 0)) best = u;
                        }
                    }
                    if (best) {
                        const st = String(best.status || '').toLowerCase();
                        if (st.includes('fail')) {
                            map.set(builtinUploadTaskKeyOf(t), {key: 'failed', text: '上传失败'});
                        } else if (st.includes('success')) {
                            map.set(builtinUploadTaskKeyOf(t), {key: 'synced', text: '已同步'});
                        } else if (st === 'uploading') {
                            map.set(builtinUploadTaskKeyOf(t), {key: 'uploading', text: `上传中 ${formatSpeed(best.speed || 0)}`});
                        } else if (st === 'waiting') {
                            map.set(builtinUploadTaskKeyOf(t), {key: 'waiting', text: '等待上传'});
                        }
                    }
                }
                return map;
            });
            // 抽屉内的上传记录列表（同一主播名匹配到的全部上传任务，最多 5 条）
            const recDrawerUploads = computed(() => {
                const record = recDrawer.record;
                if (!record) return [];
                const name = record.anchor_name && record.anchor_name !== record.room_id ? String(record.anchor_name) : '';
                const rid = record.room_id ? String(record.room_id) : '';
                return (liveTasks.value || [])
                    .filter(u => {
                        const fn = String(u && u.filename || '');
                        return fn && ((name && fn.includes(name)) || (rid.length >= 4 && fn.includes(rid)));
                    })
                    .sort((a, b) => (b.startTime || 0) - (a.startTime || 0))
                    .slice(0, 5);
            });
            const builtinUploadTaskView = (u) => {
                const total = u && u.size ? u.size : 0;
                const done = u && u.uploaded ? u.uploaded : 0;
                const pct = total > 0 ? Math.min(100, Math.round(done / total * 100)) : (u && String(u.status).includes('success') ? 100 : 0);
                const st = String(u && u.status || '').toLowerCase();
                if (st.includes('fail')) return {key: 'failed', text: '上传失败', pct, bar: 'is-failed'};
                if (st.includes('success')) return {key: 'synced', text: '已同步', pct, bar: 'is-done'};
                if (st === 'uploading') return {key: 'uploading', text: `上传中 ${formatSpeed(u.speed || 0)}`, pct, bar: ''};
                if (st === 'waiting') return {key: 'waiting', text: '等待上传', pct, bar: ''};
                return {key: 'waiting', text: st || '—', pct, bar: ''};
            };

            // 筛选态与范围文案
            const hasBuiltinFilters = computed(() =>
                !!builtinSearchQuery.value || builtinStatusFilter.value !== 'all' ||
                builtinPlatformFilter.value !== 'all' || builtinSortMode.value !== 'live');
            const clearBuiltinFilters = () => {
                builtinSearchQuery.value = '';
                builtinStatusFilter.value = 'all';
                builtinPlatformFilter.value = 'all';
                builtinSortMode.value = 'live';
                builtinCurrentPage.value = 1;
            };
            const builtinRangeText = computed(() => {
                const total = sortedBuiltinTasks.value.length;
                if (!total) return '';
                const start = (builtinCurrentPage.value - 1) * builtinPageSize.value + 1;
                const end = Math.min(builtinCurrentPage.value * builtinPageSize.value, total);
                return `${start}–${end} / ${total}`;
            });

            // 卡片「更多」菜单动作
            const pauseOrResumeBuiltin = (record) => {
                if (!record) return;
                handleSwitchBuiltin(!record.is_paused, record);
            };
            const copyBuiltinLink = async (record) => {
                if (!record) return;
                const url = getBuiltinLiveUrl(record.platform, record.room_id);
                try {
                    if (navigator.clipboard && window.isSecureContext) {
                        await navigator.clipboard.writeText(url);
                    } else {
                        const ta = document.createElement('textarea');
                        ta.value = url;
                        ta.style.position = 'fixed';
                        ta.style.opacity = '0';
                        document.body.appendChild(ta);
                        ta.select();
                        document.execCommand('copy');
                        document.body.removeChild(ta);
                    }
                    Message.success('直播间链接已复制');
                } catch (e) {
                    Message.error('复制失败，请手动复制');
                }
            };
            const confirmDeleteBuiltin = (record) => {
                if (!record) return;
                Modal.confirm({
                    title: '删除监控任务',
                    content: `确定删除 [${record.anchor_name}] 吗？删除后将停止该直播间的监控与录制。`,
                    okText: '删除',
                    cancelText: '取消',
                    okButtonProps: {status: 'danger'},
                    onOk: async () => {
                        const ok = await handleControlBuiltin('delete', record);

                            recDrawer.record.platform === record.platform && recDrawer.record.room_id === record.room_id) {

            /**
             * 【性能优化核心机制】监听标签页切换与页面可见性
             * 当页面重新回到视野，并且用户切换到了内置引擎标签卡时，主动清算后台积压的待更新封面图
             */
            watch([activeTab, isPageVisible], ([newTab, visible]) => {
                if (newTab === 'builtin_recorder' && visible) {

                            t.avatar = t._pending_avatar;

                        }

            /**
             * 构建并返回各个平台的直达跳转外链
             * @param {string} platform 平台名称标识
             * @param {string} roomId 平台对应的纯净房间 ID
             * @returns {string} 用于浏览器打开的完整直播间 URL
             */
            const getBuiltinLiveUrl = (platform, roomId) => {
                if (platform === 'Douyin') return `https://live.douyin.com/${roomId}`;
                if (platform === 'Kuaishou') return `https://live.kuaishou.com/u/${roomId}`;
                if (platform === 'Soop') return `https://play.sooplive.co.kr/${roomId}`;
                if (platform === 'Bilibili') return `https://live.bilibili.com/${roomId}`;
                if (platform === 'Twitch') return `https://www.twitch.tv/${roomId}`;
                return roomId;
            };

            /**
             * 触发浏览器原生动作，下载目标直播间当前缓存的封面图
             * @param {string} url 图片源网络地址
             * @param {string} anchorName 供文件命名的清洗后主播名字
             */
            const downloadBuiltinCover = async (url, anchorName) => {
                try {
                    const response = await fetch(url);
                    const blob = await response.blob();
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    const safeName = (anchorName || '未命名主播').replace(/[/\\?%*:|"<>]/g, '-');
                    link.download = `${safeName}_封面图_${Date.now()}.png`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(link.href);
                    Message.success('封面图片已开始下载');
                } catch (e) {
                    Message.error('图片下载失败，请直接右键保存图片');
                }
            };

            /**
             * 调用 API 接口远端拉取内置录制引擎的运行参数及其所依托的 Cookie 配置
             */
            const fetchBuiltinConfig = async () => {
                try {
                    const res1 = await api.get('/builtin_recorder/config');
                    if (res1.data) {
                        builtinSettings.value.quality = res1.data.quality || 'uhd';
                        builtinSettings.value.segment_time = res1.data.segment_time || 0;
                        builtinSettings.value.screenshot_interval = res1.data.screenshot_interval || 20;
                        builtinSettings.value.save_path = res1.data.save_path || './downloads';

                        builtinSettings.value.watermark_enable = res1.data.watermark_enable || false;
                        builtinSettings.value.video_watermark_enable = res1.data.video_watermark_enable || false;
                        builtinSettings.value.watermark_text = res1.data.watermark_text || '';
                        builtinSettings.value.watermark_format = res1.data.watermark_format || '%Y-%m-%d %H:%M:%S';
                        builtinSettings.value.watermark_position = res1.data.watermark_position || 'bottom-right';
                        builtinSettings.value.watermark_font_size = res1.data.watermark_font_size || 38;

                        let savedColor = res1.data.watermark_font_color || '#FFFFFFE6';
                        if (savedColor.includes('@') || savedColor.includes('white') || savedColor.includes('black')) {
                            savedColor = '#FFFFFFE6';
                        }
                        builtinSettings.value.watermark_font_color = savedColor;

                        // 高光切片参数：后端未返回时回落到与后端一致的默认值。
                        // 权重用 ?? 而非 ||，因为 0 是合法值（只保留单因子）。
                        builtinSettings.value.highlight_enable = res1.data.highlight_enable || false;
                        builtinSettings.value.highlight_motion_weight = res1.data.highlight_motion_weight ?? 0.8;
                        builtinSettings.value.highlight_audio_weight = res1.data.highlight_audio_weight ?? 0.2;
                        builtinSettings.value.highlight_threshold = res1.data.highlight_threshold || 1.5;
                        builtinSettings.value.highlight_min_duration = res1.data.highlight_min_duration || 15;
                        builtinSettings.value.highlight_max_duration = res1.data.highlight_max_duration || 180;
                        builtinSettings.value.highlight_merge_gap = res1.data.highlight_merge_gap || 20;
                        builtinSettings.value.highlight_per_clip = res1.data.highlight_per_clip || 3;
                        builtinSettings.value.highlight_only_upload = res1.data.highlight_only_upload || false;
                    }
                    const res2 = await api.get('/builtin_recorder/cookies');
                    if (res2.data) {
                        builtinCookies.value = res2.data;
                    }
                    fetchCookieHealth();
                } catch (e) {
                }
            };

            /**
             * 唤起内置引擎的基础设置与 Cookie 更新面板
             */
            const openBuiltinSettingsModal = () => {
                showBuiltinSettingsModal.value = true;
                fetchBuiltinConfig();
            };

            /**
             * 将用户在前端更改的内置引擎基础参数打包，下发存储至系统后端
             */
            const saveBuiltinConfig = async () => {
                builtinSaving.value = true;
                try {
                    await api.post('/builtin_recorder/config', builtinSettings.value);
                    Message.success("内置引擎水印与录制参数已生效！");
                    showBuiltinSettingsModal.value = false;
                } catch (e) {
                } finally {
                    builtinSaving.value = false;
                }
            };

            /**
             * 推送前端输入的多平台鉴权 Cookie 给后端文件落盘存储，以便穿透风控
             */
            const saveBuiltinCookies = async () => {
                builtinSavingCookies.value = true;
                try {
                    await api.post('/builtin_recorder/cookies', builtinCookies.value);
                    Message.success("内置引擎 Cookie 已热更新！");
                } catch (e) {
                } finally {
                    builtinSavingCookies.value = false;
                }
            };

            /**
             * 将前端输入框填写的链接地址，封装发起给后端录入系统的独立监听队列中
             */
            const handleAddBuiltin = async () => {
                if (!builtinForm.value.url.trim()) {
                    setBuiltinAddFeedback('error', '请填写直播间地址或ID');
                    return Message.warning("请填写直播间地址或ID");
                }
                builtinAdding.value = true;
                try {
                    // 添加接口需等后台解析短链（Chrome/HTTP 兜底），放宽到 30s 避免前端先超时
                    await api.post('/builtin_recorder/add', builtinForm.value, {timeout: 30000});
                    setBuiltinAddFeedback('success', '添加成功，引擎正在初始化监控');
                    Message.success("任务添加成功");
                    builtinForm.value.url = '';
                } catch (e) {
                    setBuiltinAddFeedback('error', (e && e.response && e.response.data && e.response.data.message) || e.message || '添加失败，请检查链接后重试');
                } finally {
                    builtinAdding.value = false;
                }
            };

            /**
             * 将多行链接文本批量解析并循坏添加至系统后端的监听记录仪中
             * @param {function} done Arco Vue `on-before-ok` 提供的生命周期回调指针
             */
            const handleBatchAddBuiltin = async (done) => {
                const lines = builtinBatchForm.value.urls.split('\n').map(l => l.trim()).filter(l => l !== '');
                if (lines.length === 0) {
                    Message.warning("内容为空");
                    done(false);
                    return;
                }
                builtinBatchAdding.value = true;
                let success = 0, fail = 0;
                for (const url of lines) {
                    try {
                        await api.post('/builtin_recorder/add', {platform: builtinBatchForm.value.platform, url: url}, {timeout: 30000});
                        success++;
                    } catch (e) {
                        fail++;
                    }
                }
                builtinBatchAdding.value = false;
                if (fail === 0) {
                    Message.success(`成功批量添加 ${success} 个任务`);
                    builtinBatchForm.value.urls = '';
                    done(true);
                } else {
                    Message.warning(`添加完成，成功 ${success} 个，失败 ${fail} 个`);
                    done(true);
                }
            };

            /**
             * 触发针对单个内置引擎任务的暂停/恢复操作逻辑
             * @param {boolean} checked 开关当前滑动的布尔状态
             * @param {Object} record 该数据行绑定的监控实体
             */
            const handleSwitchBuiltin = async (checked, record) => {
                record.switching = true;
                const action = checked ? 'resume' : 'pause';
                try {
                    await handleControlBuiltin(action, record);
                } finally {
                    record.switching = false;
                }
            };

            /**
             * 更新单个主播的「录屏 / 截屏」独立开关
             * @param {boolean|null} recordVal 录屏开关；null 表示不修改
             * @param {boolean|null} shotVal 截屏开关；null 表示不修改
             * @param {Object} record 任务行
             */
            const handleBuiltinFlags = async (recordVal, shotVal, record) => {
                record.flagsSwitching = true;
                try {
                    const payload = {
                        action: 'set_flags',
                        platform: record.platform,
                        room_id: record.room_id
                    };
                    if (recordVal !== null && recordVal !== undefined) payload.record = recordVal;
                    if (shotVal !== null && shotVal !== undefined) payload.screenshot = shotVal;
                    await api.post('/builtin_recorder/control', payload);
                    if (recordVal !== null && recordVal !== undefined) record.record = recordVal;
                    if (shotVal !== null && shotVal !== undefined) record.screenshot = shotVal;
                    Message.success('录屏/截屏开关已更新');
                } catch (e) {
                    Message.error('开关更新失败');
                } finally {
                    record.flagsSwitching = false;
                }
            };

            /**
             * 根据给定的动作指令 (挂起、继续或移除)，封装网络请求下发给后端底层去干预任务协程
             * @param {string} action 指令类型 ('resume', 'pause', 'delete')
             * @param {Object} record 操作锁定的数据块
             * @returns {Promise<boolean>} 是否执行成功的状态反馈
             */
            const handleControlBuiltin = async (action, record) => {
                try {
                    await api.post('/builtin_recorder/control', {
                        action: action,
                        platform: record.platform,
                        room_id: record.room_id
                    });
                    if (action === 'delete') Message.success("任务已删除");
                    return true;
                } catch (e) {
                    return false;
                }
            };

            /**
             * 执行最高权限的系统级批处理指令，同步强行休眠或恢复所有正在监听队列中的引擎任务
             * @param {boolean} val 全局主控制开关滑动的动作状态
             */
            const handleMasterSwitchBuiltin = async (val) => {
                const action = val ? 'resume_all' : 'pause_all';
                const actionName = val ? '全部开启' : '全部暂停';
                try {
                    await api.post('/builtin_recorder/control_all', {action: action});
                    Message.success(`已成功执行：${actionName}`);
                    builtinTasks.value.forEach(t => {
                        t.is_paused = !val;
                    });
                } catch (e) {
                }
            };

            // ========== 中文输入法组合保护 ==========
            // 应用每秒全量重渲染（clientTime 心跳 + WS 推送），Vue patch 会把输入框
            // value 回写成已提交的 modelValue；若此刻用户正在用输入法组字，正在组合
            // 的文本会被覆盖清空（表现为"打字自动被清空"）。组合期间临时接管该元素
            // 的 value setter 屏蔽程序化回写，compositionend 时立即恢复。
            let composingEl = null;
            const handleCompositionGuard = (e) => {
                const el = e.target;
                if (!el || (el.tagName !== 'INPUT' && el.tagName !== 'TEXTAREA')) return;
                if (e.type === 'compositionstart') {
                    if (composingEl === el) return;
                    if (composingEl) {
                        // 上一次组合未正常结束（如元素被替换），先恢复其 setter
                        delete composingEl.value;
                    }
                    composingEl = el;
                    const proto = el.tagName === 'INPUT'
                        ? HTMLInputElement.prototype
                        : HTMLTextAreaElement.prototype;
                    const desc = Object.getOwnPropertyDescriptor(proto, 'value');
                    Object.defineProperty(el, 'value', {
                        get() { return desc.get.call(this); },
                        set() {
                            /* 组合期间忽略程序化回写，保护正在组字的文本 */
                        },
                        configurable: true
                    });
                } else if (e.type === 'compositionend' && composingEl === el) {
                    delete el.value;
                    composingEl = null;
                }
            };

            /**
             * 全局快捷键监听注册：绑定 Ctrl+X 键可一键聚焦搜索框
             * @param {KeyboardEvent} e 全局捕获的按键事件
             */
            const handleGlobalKeydown = (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'x') {
                    const el = e.target;
                    if (el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable)) return;
                    if (activeTab.value === 'streamers') {
                        e.preventDefault();
                        if (streamerSearchRef.value) {
                            streamerSearchRef.value.focus();
                            Message.info('已激活搜索框');
                        }
                    }
                }
            };

            const recorderStatus = ref('读取中...');
            const recorderControlLoading = ref(false);
            const showLogsModal = ref(false);
            const recorderLogsContent = ref('');
            const dockerLogsRef = ref(null);
            const showBatchAddModal = ref(false);
            const batchAddText = ref('');
            const batchAddLoading = ref(false);
            const cookiesForm = reactive({douyin: '', kuaishou: '', sooplive: '', liveSavePath: ''});
            // 外部引擎 Cookie 平台卡片配置：驱动凭证页渲染
            const extCookiePlatforms = [
                {key: 'douyin', name: '抖音 (Douyin)', color: '#FE2C55', ph: '在此填入抖音 Cookie（包含 sessionid_ss 等凭证）'},
                {key: 'kuaishou', name: '快手 (Kuaishou)', color: '#FF6600', ph: '在此填入快手 Cookie'},
                {key: 'sooplive', name: 'Sooplive (AfreecaTV)', color: '#00C73C', ph: '在此填入 Sooplive Cookie'}
            ];
            const cookiesLoading = ref(false);

            /**
             * 【概览视图状态层】把后端数值翻译成 UI 直接可用的状态点 / 文案，
             * 供顶部操作栏、系统状态卡与目录卡共用，所有数据均来自现有 /status 与 WS 推送
             */
            const fmtClock = (ms) => {
                if (!ms || ms < 0) return '--:--:--';
                const d = new Date(ms), p = (n) => String(n).padStart(2, '0');
                return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
            };

            const lastScanClock = computed(() => {
                let t = 0;
                (systemStatus.dirs || []).forEach(d => {
                    if (d && d.lastScanTime > t) t = d.lastScanTime;
                });
                return t ? fmtClock(t) : '--:--:--';
            });

            const nextScanClock = computed(() => {
                if (!systemStatus.running || !systemStatus.nextScanTime || systemStatus.nextScanTime === -1) {
                    return '--:--:--';
                }
                return fmtClock(systemStatus.nextScanTime);
            });

            const engineView = computed(() => {
                if (!systemStatus.running) {
                    return {key: 'paused', title: '扫描已暂停', meta: `最后扫描 ${lastScanClock.value}`};
                }
                if (systemStatus.nextScanTime === -1) {
                    return {key: 'scanning', title: '正在扫描上传', meta: '正在同步目录状态…'};
                }
                const diff = Math.floor((systemStatus.nextScanTime - clientTime.value) / 1000);
                if (systemStatus.nextScanTime <= 0 || diff < 0) {
                    return {key: 'scanning', title: '正在扫描上传', meta: '正在准备执行扫描…'};
                }
                const m = Math.floor(diff / 60);
                const s = diff % 60;

            const handleBatchAdd = async (done) => {

                    if (commaIndex > -1) {

            /**

             * @param {string} eventType 数据触发信号事件类别标示符
             */
            const triggerWsPulse = (eventType) => {
                wsStats.msgCount++;
                wsStats.lastEvent = eventType;
                wsStats.pulse = true;
                if (wsPulseTimeout) clearTimeout(wsPulseTimeout);
                wsPulseTimeout = setTimeout(() => {

            let reconnectAttempts = 0;
            const maxReconnectDelay = 30000;
            const baseReconnectDelay = 2000;

            /**
             * 构建全功能的 WebSocket 客户端信道，并封装断线重连、密文解码鉴别与心跳存活自动确认处理机
             */
            const connectWS = async () => {
                // 已登出（或 token 被清）时不再建立连接：否则登出后挂起的重连定时器仍会拿旧 token 反复握手
                if (!isLoggedIn.value || !localStorage.getItem('upload_system_token')) return;

                if (window._encryptionEnabled && !_sessionId) {
                    await initSecurity();
                }

                if (ws) {
                    ws.onclose = null;
                    ws.close();
                }
                wsStatus.value = 'connecting';
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';

                let wsUrl = `${protocol}//${window.location.host}/ws/live`;
                if (window._encryptionEnabled && _sessionId) {
                    wsUrl += `?session_id=${_sessionId}`;
                }
                // 安全审计修复：WS 握手无法携带自定义请求头，改用查询参数传递登录令牌
                wsUrl += (wsUrl.includes('?') ? '&' : '?') + `token=${encodeURIComponent(localStorage.getItem('upload_system_token') || '')}`;

                ws = new WebSocket(wsUrl);

                lastPongTime = Date.now();

                ws.onopen = () => {
                    wsStatus.value = 'connected';
                    lastPongTime = Date.now();
                    reconnectAttempts = 0;

                    if (pingTimer) clearInterval(pingTimer);
                    pingTimer = setInterval(async () => {
                        if (ws.readyState === WebSocket.OPEN) {
                            if (Date.now() - lastPongTime > 15000) {
                                console.warn("[WS] 心跳超时，连接已假死，强制触发断开重连...");
                                ws.close();
                                return;
                            }
                            const pingRaw = JSON.stringify({type: 'ping', payload: Date.now()});

                            if (window._encryptionEnabled && _cryptoKey) {
                                const encryptedPing = await encryptPayload(pingRaw);
                                ws.send(JSON.stringify({encrypted: encryptedPing}));
                            } else {
                                ws.send(pingRaw);
                            }
                        }
                    }, 5000);
                };

                ws.onmessage = async (event) => {
                    try {
                        lastPongTime = Date.now();

                        let msgObj = JSON.parse(event.data);

                        if (window._encryptionEnabled && msgObj.encrypted) {
                            const decryptedStr = await decryptPayload(msgObj.encrypted);
                            msgObj = JSON.parse(decryptedStr);
                        }

                        const msg = msgObj;

                        if (msg.type === 'pong') {
                            wsLatency.value = Date.now() - msg.payload;
                            return;
                        }

                        triggerWsPulse(msg.type);

                        if (msg.type === 'systemAlert') {
                            const payload = msg.payload;
                            Notification[payload.level || 'error']({
                                title: payload.title,
                                content: payload.message + `\n\n触发时间: ${payload.time}`,
                                duration: 0,
                                closable: true,
                                position: 'bottomRight',
                                style: {whiteSpace: 'pre-wrap', wordBreak: 'break-all', lineHeight: '1.6'}
                            });
                        } else if (msg.type === 'trafficMetrics') {
                            trafficMetrics.speed = msg.payload.speed;
                            trafficMetrics.time = msg.payload.time;
                        } else if (msg.type === 'statsTrend') {
                            const newStr = JSON.stringify(msg.payload);
                            if (window.lastStatsStr !== newStr) {
                                window.lastStatsStr = newStr;
                                statsData.trend = msg.payload.trend || [];
                                statsData.rank = msg.payload.rank || [];
                                if (activeTab.value === 'overview' && statsData.trend.length > 0) {
                                    nextTick(() => renderTrendChart());
                                }
                            }
                        } else if (msg.type === 'recorderStatus') {
                            recorderStatus.value = msg.payload;
                        } else if (msg.type === 'activeStreamers') {
                            activeRecordingStreamers.value = msg.payload || [];
                        } else if (msg.type === 'streamersData') {
                            if (!isSavingStreamers.value) {
                                const newStr = JSON.stringify(msg.payload);
                                if (window.lastStreamersStr !== newStr) {
                                    streamers.value = msg.payload;
                                    window.lastStreamersStr = newStr;
                                }
                            }
                        } else if (msg.type === 'uploadProgress') {
                            const idx = liveTasks.value.findIndex(t => t.id === msg.payload.id);
                            if (idx > -1) {
                                liveTasks.value[idx].uploaded = msg.payload.uploaded;
                                liveTasks.value[idx].speed = msg.payload.speed;
                                liveTasks.value[idx].status = msg.payload.status;
                            } else {
                                liveTasks.value.unshift({
                                    id: msg.payload.id, filename: msg.payload.filename, path: msg.payload.path,
                                    size: msg.payload.size, uploaded: msg.payload.uploaded, speed: msg.payload.speed,
                                    status: msg.payload.status, startTime: msg.payload.startTime, duration: 0
                                });
                            }
                        } else if (msg.type === 'systemStatus') {
                            Object.assign(systemStatus, msg.payload);
                        } else if (msg.type === 'queueStatus') {
                            Object.assign(queueStatus, msg.payload);
                        } else if (msg.type === 'taskDone') {
                            const idx = liveTasks.value.findIndex(t => t.id === msg.payload.id);
                            if (idx > -1) {
                                liveTasks.value[idx].status = msg.payload.status;
                                if (msg.payload.progress === 100) liveTasks.value[idx].uploaded = liveTasks.value[idx].size;
                                if (msg.payload.error) liveTasks.value[idx].error = msg.payload.error;
                            }
                            if (activeTab.value === 'history') fetchHistory();
                        } else if (msg.type === 'newLog') {
                            const log = msg.payload;
                            if (logQuery.page === 1 && !logQuery.keyword && (!logQuery.level || logQuery.level === log.level)) {
                                logData.items.unshift(log);
                                logData.total++;
                                if (logData.items.length > logQuery.limit) {
                                    logData.items.pop();
                                }
                            }
                        } else if (msg.type === 'scanStarted') {
                            let titleText = '📡 系统扫描已启动';
                            let contentText = `当前并发：${msg.payload.workers} 个线程\n扫描目标：共 ${msg.payload.dirs.length} 个目录`;
                            if (msg.payload.trigger === 'auto') {
                                titleText = '⏱️ 定时扫描执行中';
                                contentText = `定时周期：${msg.payload.interval} 分钟/次\n` + contentText;
                            } else if (msg.payload.trigger === 'start') {
                                titleText = '▶️ 系统已恢复运行';
                            } else if (msg.payload.trigger === 'rescan') {
                                titleText = '🔍 手动深度扫描启动';
                            } else if (msg.payload.trigger === 'config-update') {
                                titleText = '⚙️ 配置重载扫描';
                            }
                            Notification.info({
                                title: titleText, content: contentText, position: 'bottomRight', duration: 4000,
                                style: {whiteSpace: 'pre-wrap', lineHeight: '1.6'}
                            });
                        } else if (msg.type === 'scanFinished') {
                            Notification.success({
                                title: '✅ 扫描侦测完毕',
                                content: `本轮深度比对完成，共发现并压入 ${msg.payload.added} 个新文件至队列中。`,
                                position: 'bottomRight',
                                duration: 4000
                            });
                        } else if (msg.type === 'builtinTasks') {
                            builtinLastSync.value = Date.now();
                            // ✨ 性能优化修改点：处理后端海量推送时的视觉静默拦截
                            const payloadTasks = msg.payload || [];

                            // 1. 从原数组中移除后端已经不存在的任务
                            for (let i = builtinTasks.value.length - 1; i >= 0; i--) {
                                const exists = payloadTasks.find(t => t.platform === builtinTasks.value[i].platform && t.room_id === builtinTasks.value[i].room_id);
                                if (!exists) {
                                    builtinTasks.value.splice(i, 1);
                                }
                            }

                            // 2. 更新存在的任务，或将新任务追加到原数组
                            payloadTasks.forEach(pTask => {
                                const existing = builtinTasks.value.find(t => t.platform === pTask.platform && t.room_id === pTask.room_id);
                                if (existing) {
                                    // 原地合并属性
                                    existing.anchor_name = pTask.anchor_name;
                                    existing.status = pTask.status;
                                    existing.duration = pTask.duration;
                                    existing.file_size = pTask.file_size;
                                    existing.is_paused = pTask.is_paused;
                                    // 单主播截图间隔/水印/画质/时长/时段覆盖：后端每次全量快照都带最新值
                                    existing.shot_interval = pTask.shot_interval || 0;
                                    existing.watermark = pTask.watermark || 0;
                                    existing.quality_override = pTask.quality_override || '';
                                    existing.max_duration = pTask.max_duration || 0;
                                    existing.segment_time = pTask.segment_time || 0;
                                    existing.window = pTask.window || '';

                                    // 【核心流量拦截】只有在页面可见且停留在当前 Tab 时，才主动更新 DOM 触发浏览器图片拉取
                                    if (isPageVisible.value && activeTab.value === 'builtin_recorder') {
                                        existing.avatar = pTask.avatar;
                                        // 维持预览图更新逻辑
                                        if (globalPreview.visible && globalPreview.platform === pTask.platform && globalPreview.roomId === pTask.room_id) {
                                            globalPreview.src = pTask.avatar;
                                        }
                                    } else {
                                        // 【核心流量拦截】将未渲染的最新地址暂存在内存缓冲变量里
                                        existing._pending_avatar = pTask.avatar;
                                    }
                                } else {
                                    pTask.switching = false;
                                    // 【核心流量拦截】初次载入时也要判断是否应该加载图片
                                    if (!(isPageVisible.value && activeTab.value === 'builtin_recorder')) {
                                        pTask._pending_avatar = pTask.avatar;
                                        pTask.avatar = null;
                                    }
                                    builtinTasks.value.push(pTask);
                                }
                            });
                        }
                    } catch (e) {
                        console.error("解密流数据发生异常：", e);
                    }
                };

                ws.onclose = () => {
                    wsStatus.value = 'disconnected';
                    wsLatency.value = 0;
                    if (pingTimer) clearInterval(pingTimer);

                    if (isLoggedIn.value) {
                        const delay = Math.min(
                            maxReconnectDelay,
                            baseReconnectDelay * Math.pow(1.5, reconnectAttempts)
                        ) + (Math.random() * 1000);

                        reconnectAttempts++;

                        console.warn(`[WS] 连接断开，将在 ${(delay/1000).toFixed(1)} 秒后进行第 ${reconnectAttempts} 次重连...`);
                        setTimeout(connectWS, delay);
                    }
                };
                ws.onerror = () => {
                    wsStatus.value = 'disconnected';
                };
            };

            /**
             * 提取对系统状态发起干预操作的事件，并对诸如系统起停指令予以强弹窗提醒用户防手滑拦截
             * @param {string} action 指令的动作短语
             */
            const control = (action) => {
                const actionText = {
                    'start': '确定要启动系统吗？', 'pause': '确定要暂停吗？', 'stop': '危险操作：强行停止系统吗？',
                    'rescan': '立刻触发深度扫描吗？', 'relogin': '刷新远端授权？', 'clear-fail-queue': '清空失败记录？',
                    'retry-fail-queue': '重试失败任务？', 'clear-success-queue': '清空成功记录？'
                };
                Modal.confirm({
                    title: '操作确认',
                    content: actionText[action] || '确定要执行吗？',
                    okText: '执行',
                    cancelText: '取消',
                    onOk: async () => {
                        pendingControl.value = action;
                        try {
                            await api.post(`/control/${action}`);
                            Message.success('指令已下发');
                        } catch (e) {
                        } finally {
                            pendingControl.value = '';
                        }
                    }
                });
            };

            /**
             * 依据设定的分页搜索结构从服务端数据库载入过往切片传输完成与否的历史详单
             */
            const fetchHistory = async () => {
                try {
                    const res = await api.get('/tasks/history', {params: historyQuery});
                    historyData.items = res.data.items || [];
                    historyData.total = res.data.total || 0;
                } catch (e) {
                }
            };

            /**
             * 表格组件页脚翻页操作触发器，回传页面角标供上游检索新数据层使用

             */
            const onPageChange = (page) => {
                historyQuery.page = page;
                fetchHistory();
            };

            /**
             * 触发记录表单每页载客量重新定配操作功能
             * @param {number} size 新定的数据载荷行数

            const onPageSizeChange = (size) => {
                historyQuery.limit = size;
                historyQuery.page = 1;

            /**

             */
            const fetchLogs = async () => {
                try {
                    const res = await api.get('/logs', {params: logQuery});

             */
            const downloadLogs = async () => {
                try {
                    // level/keyword 进查询串，必须编码，否则关键词里的空格、&、# 会截断参数
                    let url = `/api/v1/logs/download?limit=${logExportLimit.value}&level=${encodeURIComponent(logQuery.level || '')}&keyword=${encodeURIComponent(logQuery.keyword || '')}`;
                    if (window._encryptionEnabled) {

            const fetchConfig = async () => {

             */
            const saveConfig = async () => {

                    await api.put('/config', configForm.value);
