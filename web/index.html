<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <!-- 保留缩放能力：禁用 user-scalable 会挡住移动端双指放大（无障碍问题） -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="referrer" content="no-referrer"/>

    <title>直播录制管理系统</title>
    <link rel="icon"
          href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2236%22 fill=%22none%22 stroke=%22%2322c55e%22 stroke-width=%2216%22/></svg>">
    <!-- 前端依赖自托管（随二进制发布），不走公网 CDN：离线可用、首屏无重定向延迟 -->
    <script src="/vendor/vue.global.prod.js"></script>
    <script src="/vendor/axios.min.js"></script>
    <script src="/vendor/echarts.min.js"></script>

    <style>
        /* ================================================================
           直播录制管理系统 · 控制台重设计
           视觉语言：沉浸暗色 / 药丸按钮 / 单一强调色（绿）
           ================================================================ */
        :root {
            --bg: #070908;
            --bg-glow-1: rgba(34, 197, 94, 0.07);
            --bg-glow-2: rgba(59, 130, 246, 0.05);
            --panel: #101312;
            --panel-2: #161a18;
            --panel-3: #1c211e;
            --line: rgba(255, 255, 255, 0.07);
            --line-strong: rgba(255, 255, 255, 0.12);
            --t1: #f3f5f4;
            --t2: #9ba39e;
            --t3: #646b66;
            --t4: #454b47;
            --green: #22c55e;
            --green-bright: #4ade80;
            --green-dim: rgba(34, 197, 94, 0.14);
            --blue: #3b82f6;
            --blue-dim: rgba(59, 130, 246, 0.16);
            --red: #ef4444;
            --red-bright: #f87171;
            --red-dim: rgba(239, 68, 68, 0.14);
            --orange: #f59e0b;
            --orange-dim: rgba(245, 158, 11, 0.15);
            --cyan: #38bdf8;
            --shadow: 0 18px 48px rgba(0, 0, 0, 0.45);
            --sb-w: 208px;
            --r-lg: 16px;
            --r-md: 12px;
            --r-sm: 9px;
        }

        html[data-theme='light'] {
            --bg: #eef1ee;
            --bg-glow-1: rgba(34, 197, 94, 0.10);
            --bg-glow-2: rgba(59, 130, 246, 0.08);
            --panel: #ffffff;
            --panel-2: #f4f6f4;
            --panel-3: #eaeeeb;
            --line: rgba(15, 23, 19, 0.09);
            --line-strong: rgba(15, 23, 19, 0.16);
            --t1: #17201b;
            --t2: #5c665f;
            --t3: #8b948d;
            --t4: #b3bab4;
            --shadow: 0 14px 34px rgba(23, 32, 27, 0.10);
        }

        * { box-sizing: border-box; }
        [v-cloak] { display: none; }

        html, body {
            max-width: 100vw;
            height: 100%;
            overflow: hidden;
            -webkit-text-size-adjust: 100%;
        }

        body {
            margin: 0;
            padding: 0;
            background:
                radial-gradient(1100px 520px at 82% -10%, var(--bg-glow-1), transparent 60%),
                radial-gradient(900px 480px at -8% 108%, var(--bg-glow-2), transparent 55%),
                var(--bg);
            color: var(--t1);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            font-size: 14px;
            line-height: 1.5;
            transition: background-color 0.35s ease, color 0.35s ease;
        }

        ::selection { background: rgba(34, 197, 94, 0.32); }

        ::-webkit-scrollbar { width: 9px; height: 9px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(128, 138, 132, 0.22); border-radius: 8px; border: 2px solid transparent; background-clip: content-box; }
        ::-webkit-scrollbar-thumb:hover { background-color: rgba(128, 138, 132, 0.4); }

        .ic { width: 16px; height: 16px; flex-shrink: 0; vertical-align: -3px; }

        /* ===================== 布局骨架 ===================== */
        .shell { display: flex; height: 100vh; height: 100dvh; overflow: hidden; }

        .sb {
            width: var(--sb-w);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            padding: 18px 14px 14px;
            border-right: 1px solid var(--line);
            background: color-mix(in srgb, var(--bg) 72%, #000 28%);
        }
        html[data-theme='light'] .sb { background: color-mix(in srgb, var(--panel) 60%, var(--bg) 40%); }

        .sb-logo {
            display: flex; align-items: center; gap: 10px;
            font-weight: 700; font-size: 15px; letter-spacing: 0.2px;
            padding: 2px 8px 16px;
        }
        .sb-logo-ic {
            width: 26px; height: 26px; border-radius: 8px; flex-shrink: 0;
            background: linear-gradient(145deg, #2fd36a, #17a34a);
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 14px rgba(34, 197, 94, 0.35);
        }
        .sb-logo-ic .ic { width: 14px; height: 14px; color: #04120a; }

        .sb-nav { display: flex; flex-direction: column; gap: 3px; flex: 1; overflow-y: auto; }
        .sb-item {
            display: flex; align-items: center; gap: 11px;
            padding: 9px 12px; border-radius: 11px;
            color: var(--t2); font-size: 13.5px; cursor: pointer;
            border: 1px solid transparent;
            transition: background-color 0.18s ease, color 0.18s ease;
            user-select: none; white-space: nowrap;
        }
        .sb-item:hover { color: var(--t1); background: var(--panel-2); }
        .sb-item.on { color: var(--t1); background: var(--panel-3); border-color: var(--line); font-weight: 600; }
        .sb-item.on .ic { color: var(--green-bright); }
        .sb-item .ic { width: 17px; height: 17px; }

        .sb-foot { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; }
        .sb-engine {
            display: flex; gap: 10px; align-items: flex-start;
            background: var(--panel); border: 1px solid var(--line);
            border-radius: var(--r-md); padding: 11px 12px;
        }
        .sb-engine .t { font-size: 12.5px; font-weight: 600; color: var(--t1); }
        .sb-engine .s { font-size: 11px; color: var(--t3); margin-top: 2px; }
        .sb-out {
            display: flex; align-items: center; gap: 9px;
            padding: 8px 12px; border-radius: 10px; cursor: pointer;
            color: var(--t3); font-size: 13px; user-select: none;
            transition: color 0.15s ease, background-color 0.15s ease;
        }
        .sb-out:hover { color: var(--red-bright); background: var(--red-dim); }

        .mn {
            flex: 1; min-width: 0; overflow-y: auto; overflow-x: hidden;
            padding: 26px 28px 40px;
            scroll-behavior: smooth;
        }
        .page { max-width: 1460px; margin: 0 auto; animation: pageIn 0.28s ease; }
        @keyframes pageIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

        /* ===================== 页头 ===================== */
        .pg-head {
            display: flex; justify-content: space-between; align-items: flex-start;
            gap: 16px; margin-bottom: 16px; flex-wrap: wrap;
        }
        .pg-head h1 { margin: 0; font-size: 23px; font-weight: 700; letter-spacing: 0.3px; }
        .pg-head .sub { margin-top: 5px; font-size: 12.5px; color: var(--t3); }
        .pg-tools { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }

        .pill {
            display: inline-flex; align-items: center; gap: 7px;
            border-radius: 999px; border: 1px solid var(--line);
            background: var(--panel); color: var(--t1);
            padding: 8px 16px; font-size: 13px; font-weight: 500;
            cursor: pointer; user-select: none; white-space: nowrap;
            transition: background-color 0.16s ease, border-color 0.16s ease, transform 0.1s ease, opacity 0.16s ease;
        }
        .pill:hover { background: var(--panel-2); border-color: var(--line-strong); }
        .pill:active { transform: scale(0.97); }
        .pill.primary {
            background: linear-gradient(160deg, #34d469, #1eb257);
            border-color: transparent; color: #05130a; font-weight: 700;
            box-shadow: 0 6px 18px rgba(34, 197, 94, 0.28);
        }
        .pill.primary:hover { background: linear-gradient(160deg, #3fdd75, #24bd61); }
        .pill.danger { color: var(--red-bright); border-color: rgba(239, 68, 68, 0.35); background: var(--red-dim); }
        .pill.danger:hover { background: rgba(239, 68, 68, 0.22); }
        .pill.sm { padding: 5px 12px; font-size: 12px; gap: 5px; }
        .pill.xs { padding: 3px 10px; font-size: 11.5px; }
        .pill[disabled] { opacity: 0.45; pointer-events: none; }
        .pill .spin { animation: spin 0.9s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .icobtn {
            width: 34px; height: 34px; border-radius: 999px;
            border: 1px solid var(--line); background: var(--panel);
            color: var(--t2); cursor: pointer;
            display: inline-flex; align-items: center; justify-content: center;
            transition: background-color 0.16s ease, color 0.16s ease;
        }
        .icobtn:hover { color: var(--t1); background: var(--panel-2); }

        .chip {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 11.5px; padding: 3px 10px; border-radius: 999px;
            background: var(--panel-2); border: 1px solid var(--line); color: var(--t2);
            white-space: nowrap;
        }
        .chip b { color: var(--t1); font-weight: 600; }
        .chip.good { color: var(--green-bright); border-color: rgba(34, 197, 94, 0.3); background: var(--green-dim); }

        /* 状态点 */
        .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0; background: var(--t4); }
        .dot.run { background: var(--green); box-shadow: 0 0 8px rgba(34, 197, 94, 0.8); }
        .dot.pulse { animation: dotPulse 1.6s ease infinite; }
        .dot.err { background: var(--red); }
        .dot.warn { background: var(--orange); }
        .dot.blue { background: var(--blue); }
        .dot.gray { background: var(--t4); }
        @keyframes dotPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

        /* ===================== 卡片 ===================== */
        .card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--r-lg);
            padding: 18px;
        }
        .card-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
        .card-title { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .card-title .mini { font-size: 11.5px; font-weight: 400; color: var(--t3); }
        .card-title .ic { color: var(--t3); width: 15px; height: 15px; }

        /* ===================== 统计卡 ===================== */
        .statrow { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 14px; }
        .statrow.c4 { grid-template-columns: repeat(4, 1fr); }
        .stat-card {
            background: var(--panel); border: 1px solid var(--line);
            border-radius: var(--r-md); padding: 13px 16px;
            display: flex; flex-direction: column; gap: 4px;
            transition: border-color 0.2s ease;
        }
        .stat-card:hover { border-color: var(--line-strong); }
        .stat-card .k { font-size: 12px; color: var(--t3); display: flex; align-items: center; gap: 6px; }
        .stat-card .v { font-size: 26px; font-weight: 700; line-height: 1.2; font-variant-numeric: tabular-nums; }
        .stat-card .aside { font-size: 11px; color: var(--t4); }
        .v.c-green { color: var(--green-bright); }
        .v.c-blue { color: #60a5fa; }
        .v.c-red { color: var(--red-bright); }

        /* ===================== 概览网格 ===================== */
        .grid-main { display: grid; grid-template-columns: 1.9fr 1fr; gap: 12px; margin-bottom: 12px; }
        .trend-box { height: 240px; }
        .rank-rows { display: flex; flex-direction: column; gap: 11px; }
        .rank-row .line { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; margin-bottom: 5px; }
        .rank-row .nm { display: flex; align-items: center; gap: 8px; min-width: 0; }
        .rank-row .idx { color: var(--t4); font-size: 11px; font-variant-numeric: tabular-nums; }
        .rank-row .txt { color: var(--t1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .rank-row .sz { color: var(--t2); font-variant-numeric: tabular-nums; flex-shrink: 0; }
        .rank-bar { height: 5px; border-radius: 4px; background: var(--panel-3); overflow: hidden; }
        .rank-bar i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #2ea35c, #4ade80); transition: width 0.5s ease; }
        .rank-foot { margin-top: 10px; font-size: 11.5px; color: var(--t3); text-align: right; }
        .rank-foot b { color: var(--t2); }
        .disk-warn {
            display: flex; gap: 8px; align-items: center;
            font-size: 12px; color: var(--orange); background: var(--orange-dim);
            border: 1px solid rgba(245, 158, 11, 0.3); border-radius: 9px;
            padding: 7px 11px; margin-bottom: 12px;
        }

        .queue-body { display: flex; align-items: center; gap: 22px; }
        .queue-stats { flex: 1; display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px 10px; }
        .q-stat .k { font-size: 11.5px; color: var(--t3); margin-bottom: 3px; }
        .q-stat .v { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
        .q-stat .v small { font-size: 12px; font-weight: 500; margin-left: 3px; }
        .q-stat .sub { font-size: 11px; color: var(--t4); }
        .donut-wrap { position: relative; width: 150px; height: 150px; flex-shrink: 0; }
        .donut-wrap .center {
            position: absolute; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; pointer-events: none;
        }
        .donut-wrap .center .n { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
        .donut-wrap .center .l { font-size: 11px; color: var(--t3); }

        .sys-blocks { display: flex; flex-direction: column; }
        .sys-block { padding: 10px 0; border-bottom: 1px dashed var(--line); }
        .sys-block:last-child { border-bottom: none; padding-bottom: 0; }
        .sys-block:first-child { padding-top: 0; }
        .sys-line { display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; padding: 3.5px 0; }
        .sys-line > span:first-child { color: var(--t3); }
        .sys-line b { font-weight: 600; color: var(--t1); font-variant-numeric: tabular-nums; }
        .sys-name { display: flex; align-items: center; gap: 8px; font-weight: 600; color: var(--t1); font-size: 13px; }
        .linkish { color: var(--green-bright); cursor: pointer; font-size: 12.5px; background: none; border: none; padding: 0; font-family: inherit; }
        .linkish:hover { text-decoration: underline; }
        .linkish[disabled] { opacity: 0.5; cursor: default; text-decoration: none; }

        .sec-head { display: flex; justify-content: space-between; align-items: center; margin: 18px 2px 12px; gap: 10px; flex-wrap: wrap; }
        .sec-title { font-size: 14.5px; font-weight: 700; display: flex; align-items: center; gap: 9px; }
        .sec-title .mini { font-size: 11.5px; font-weight: 400; color: var(--t3); }
        .sec-side { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--t3); }

        .dirgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
        .dir-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px 16px; }
        .dir-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 11px; }
        .dir-path { font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 6px; min-width: 0; }
        .dir-path span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .dir-status { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--t3); flex-shrink: 0; }
        .dir-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .dir-stat .k { font-size: 10.5px; color: var(--t3); }
        .dir-stat .v { font-size: 15.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
        .dir-foot { display: flex; justify-content: space-between; margin-top: 11px; font-size: 11px; color: var(--t4); }
        .dir-foot .new { color: var(--green-bright); font-weight: 600; }
    </style>

    <style>
        /* ===================== 工具条 / 筛选 ===================== */
        .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
        .runline { display: flex; align-items: center; gap: 9px; font-size: 13px; color: var(--t2); }
        .runline b { color: var(--t1); font-weight: 600; }
        .runline .sep { color: var(--t4); }

        .inp {
            background: var(--panel-2); border: 1px solid var(--line);
            color: var(--t1); border-radius: 10px;
            padding: 8px 12px; font-size: 13px; font-family: inherit;
            outline: none; min-width: 0;
            transition: border-color 0.15s ease, background-color 0.15s ease;
        }
        .inp::placeholder { color: var(--t4); }
        .inp:focus { border-color: rgba(34, 197, 94, 0.55); background: var(--panel); }
        textarea.inp { resize: vertical; line-height: 1.6; }
        .inp-wrap { position: relative; display: inline-flex; align-items: center; }
        .inp-wrap > .ic { position: absolute; left: 11px; color: var(--t4); width: 14px; height: 14px; pointer-events: none; }
        .inp-wrap > .inp { padding-left: 32px; }
        .inp-wrap.fluid { display: flex; }
        .inp-wrap.fluid > .inp { flex: 1; }

        /* 开关 */
        .xsw {
            --w: 34px; --h: 19px; --k: 15px;
            position: relative; border: none; padding: 0;
            width: var(--w); height: var(--h); border-radius: 999px;
            background: var(--panel-3); border: 1px solid var(--line-strong);
            cursor: pointer; flex-shrink: 0;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }
        .xsw.sm { --w: 30px; --h: 17px; --k: 13px; }
        .xsw .knob {
            position: absolute; top: 50%; left: 2px;
            width: var(--k); height: var(--k); border-radius: 50%;
            background: #7b837d; transform: translateY(-50%);
            transition: left 0.2s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.2s ease;
            display: flex; align-items: center; justify-content: center;
        }
        .xsw.is-on { background: var(--green); border-color: transparent; }
        .xsw.is-on .knob { left: calc(100% - var(--k) - 2px); background: #ffffff; }
        .xsw.is-loading, .xsw.is-disabled { opacity: 0.55; cursor: not-allowed; }
        .xsw .knob svg { width: 10px; height: 10px; color: #0b120d; animation: spin 0.9s linear infinite; }

        /* 自定义下拉 */
        .xsel { position: relative; display: inline-block; }
        .xsel-btn {
            display: inline-flex; align-items: center; justify-content: space-between; gap: 8px;
            background: var(--panel-2); border: 1px solid var(--line); color: var(--t1);
            border-radius: 10px; padding: 8px 12px; font-size: 13px; font-family: inherit;
            cursor: pointer; min-width: 108px; transition: border-color 0.15s ease;
        }
        .xsel-btn:hover, .xsel.is-open .xsel-btn { border-color: rgba(34, 197, 94, 0.45); }
        .xsel-btn .ph { color: var(--t4); }
        .xsel-btn .arrow { width: 13px; height: 13px; color: var(--t3); transition: transform 0.18s ease; }
        .xsel.is-open .arrow { transform: rotate(180deg); }
        .xsel-pop {
            position: absolute; z-index: 60; top: calc(100% + 6px); left: 0;
            min-width: 100%; max-height: 264px; overflow-y: auto;
            background: var(--panel-2); border: 1px solid var(--line-strong);
            border-radius: 11px; padding: 5px; box-shadow: var(--shadow);
        }
        .xsel-pop.up { top: auto; bottom: calc(100% + 6px); }
        .xsel-opt {
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
            padding: 7px 10px; border-radius: 8px; font-size: 12.5px;
            color: var(--t2); cursor: pointer; white-space: nowrap;
        }
        .xsel-opt:hover { background: var(--panel-3); color: var(--t1); }
        .xsel-opt.is-on { color: var(--green-bright); font-weight: 600; }
        .xsel-opt .ic { width: 13px; height: 13px; }

        /* 菜单 */
        .xmenu { position: relative; display: inline-block; }
        .xmenu-pop {
            position: absolute; z-index: 70; right: 0; top: calc(100% + 6px);
            min-width: 150px; background: var(--panel-2);
            border: 1px solid var(--line-strong); border-radius: 11px;
            padding: 5px; box-shadow: var(--shadow);
        }
        .xmenu-pop.up { top: auto; bottom: calc(100% + 6px); }
        .xmenu-item {
            display: flex; align-items: center; gap: 9px;
            padding: 8px 11px; border-radius: 8px; font-size: 12.5px;
            color: var(--t2); cursor: pointer; white-space: nowrap;
        }
        .xmenu-item:hover { background: var(--panel-3); color: var(--t1); }
        .xmenu-item.is-danger { color: var(--red-bright); }
        .xmenu-item.is-danger:hover { background: var(--red-dim); }
        .xmenu-item[disabled] { opacity: 0.4; pointer-events: none; }
        .xmenu-item .ic { width: 14px; height: 14px; }

        /* 分段药丸 */
        .segpills { display: inline-flex; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
        .segpills button {
            border: none; background: transparent; color: var(--t2);
            font-size: 12.5px; font-family: inherit; padding: 6px 15px;
            border-radius: 999px; cursor: pointer; white-space: nowrap;
            display: inline-flex; align-items: center; gap: 6px;
            transition: background-color 0.16s ease, color 0.16s ease;
        }
        .segpills button:hover { color: var(--t1); }

        .stats-cell { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--r-md); padding: 13px 15px; }
        .stats-cell .k { font-size: 11.5px; color: var(--t3); }
        .stats-cell .v { font-size: 23px; font-weight: 700; margin-top: 3px; font-variant-numeric: tabular-nums; }
        .stats-cell .v.green { color: var(--green-bright); }
        .stat-bars { display: flex; flex-direction: column; gap: 8px; }
        .stat-bar-row { display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: 11px; font-size: 12px; }
        .stat-bar-row .nm { color: var(--t2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: right; }
        .stat-bar-row .bar { height: 9px; border-radius: 5px; background: var(--panel-3); overflow: hidden; }
        .stat-bar-row .bar i { display: block; height: 100%; border-radius: 5px; transition: width 0.4s ease; }
        .stat-bar-row .bar.g i { background: linear-gradient(90deg, #1fae57, #4ade80); }
        .stat-bar-row .bar.b i { background: linear-gradient(90deg, #2563eb, #60a5fa); }
        .stat-bar-row .val { color: var(--t3); font-size: 11.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
        .stats-foot { margin-top: 14px; font-size: 11px; color: var(--t4); text-align: right; }

        /* ===================== 登录页 ===================== */
        .login-wrap {
            height: 100vh; height: 100dvh; display: flex; align-items: center; justify-content: center;
            padding: 20px;
            background:
                radial-gradient(900px 480px at 14% -6%, var(--bg-glow-1), transparent 60%),
                radial-gradient(820px 460px at 88% 104%, var(--bg-glow-2), transparent 55%),
                var(--bg);
        }
        .login-card {
            width: 400px; max-width: 94vw;
            background: var(--panel); border: 1px solid var(--line);
            border-radius: 20px; padding: 36px 34px 26px;
            box-shadow: var(--shadow);
            animation: modIn 0.3s cubic-bezier(0.34, 1.3, 0.64, 1);
        }
        .login-logo { display: flex; justify-content: center; margin-bottom: 15px; }
        .login-logo .ring {
            width: 52px; height: 52px; border-radius: 50%;
            border: 13px solid var(--green);
            box-shadow: 0 6px 26px rgba(34, 197, 94, 0.4);
        }
        .login-card h2 { margin: 0 0 5px; text-align: center; font-size: 19px; font-weight: 700; }
        .login-card .lsub { text-align: center; font-size: 12px; color: var(--t3); margin-bottom: 24px; }
        .login-card .f-lb { font-size: 12px; color: var(--t2); margin: 13px 0 6px; }
        .login-card .inp { width: 100%; padding: 10px 13px; border-radius: 11px; }
        .login-card .inp-wrap .ic { left: 13px; }
        .login-card .inp-wrap .inp { padding-left: 36px; }
        .login-btn { width: 100%; justify-content: center; padding: 11px 16px; font-size: 14px; margin-top: 22px; border-radius: 999px; }
        .login-foot { margin-top: 22px; text-align: center; font-size: 11px; color: var(--t4); }
        .login-foot .gh { display: block; margin-top: 5px; }
        .login-foot a { color: var(--t3); text-decoration: none; }
        .login-foot a:hover { color: var(--green-bright); }

        /* ===================== Toast / Notification ===================== */
        .toasts { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; }
        .toast {
            display: flex; align-items: center; gap: 8px;
            background: var(--panel-2); border: 1px solid var(--line-strong);
            color: var(--t1); font-size: 13px;
            border-radius: 999px; padding: 9px 18px;
            box-shadow: var(--shadow); animation: toastIn 0.25s cubic-bezier(0.34, 1.4, 0.64, 1);
            max-width: 78vw;
        }
        .toast .ic { width: 15px; height: 15px; }
        .toast.success .ic { color: var(--green-bright); }
        .toast.error .ic { color: var(--red-bright); }
        .toast.warning .ic { color: #fbbf24; }
        .toast.info .ic { color: #7ab0ff; }
        @keyframes toastIn { from { opacity: 0; transform: translateY(-12px) scale(0.94); } to { opacity: 1; transform: none; } }
        .toast.out { opacity: 0; transform: translateY(-8px); transition: all 0.25s ease; }

        .notifies { position: fixed; right: 18px; bottom: 18px; z-index: 210; display: flex; flex-direction: column; gap: 10px; width: 340px; max-width: 92vw; }
        .notify {
            background: var(--panel-2); border: 1px solid var(--line-strong);
            border-radius: 13px; padding: 12px 14px; box-shadow: var(--shadow);
            animation: notifIn 0.28s cubic-bezier(0.34, 1.3, 0.64, 1);
        }
        @keyframes notifIn { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }
        .notify .hd { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; }
        .notify .hd .ic { width: 15px; height: 15px; flex-shrink: 0; }
        .notify.success .hd .ic { color: var(--green-bright); }
        .notify.error .hd .ic { color: var(--red-bright); }
        .notify.warning .hd .ic { color: #fbbf24; }
        .notify.info .hd .ic { color: #7ab0ff; }
        .notify .bd { font-size: 12px; color: var(--t2); margin-top: 5px; white-space: pre-wrap; word-break: break-all; line-height: 1.6; }
        .notify .x { margin-left: auto; border: none; background: none; color: var(--t3); cursor: pointer; padding: 0 2px; font-size: 15px; line-height: 1; font-family: inherit; }
        .notify .x:hover { color: var(--t1); }
        .notify.out { opacity: 0; transform: translateX(24px); transition: all 0.28s ease; }

        /* 图片预览 */
        .img-preview { position: fixed; inset: 0; z-index: 300; background: rgba(1, 3, 2, 0.88); display: flex; align-items: center; justify-content: center; cursor: zoom-out; backdrop-filter: blur(4px); }
        .img-preview img { max-width: 92vw; max-height: 90vh; border-radius: 10px; box-shadow: var(--shadow); }

        /* ===================== 响应式 ===================== */
        @media (max-width: 1200px) {
            .rec-grid { grid-template-columns: repeat(3, 1fr); }
            .statrow { grid-template-columns: repeat(3, 1fr); }
            .dirgrid { grid-template-columns: repeat(2, 1fr); }
            .frm-grid, .frm-grid.c4 { grid-template-columns: repeat(2, 1fr); }
            .grid-main { grid-template-columns: 1fr; }
        }
        @media (max-width: 900px) {
            .shell { flex-direction: column; }
            .sb {
                width: 100%; flex-direction: row; align-items: center;
                padding: 10px 14px; border-right: none; border-bottom: 1px solid var(--line);
                gap: 8px; overflow-x: auto;
            }
            .sb-logo { padding: 0 10px 0 0; }
            .sb-logo .txt { display: none; }
            .sb-nav { flex-direction: row; gap: 4px; overflow-x: auto; }
            .sb-item { padding: 7px 11px; }
            .sb-item span.lb { display: none; }
            .sb-foot { margin: 0; flex-direction: row; align-items: center; }
            .sb-engine { display: none; }
            .sb-out { padding: 7px 9px; }
            .sb-out .lb { display: none; }
            .mn { padding: 16px 14px 34px; }
            .statrow, .statrow.c4 { grid-template-columns: repeat(2, 1fr); }
            .rec-grid { grid-template-columns: repeat(2, 1fr); }
            .dirgrid { grid-template-columns: 1fr; }
            .queue-body { flex-direction: column; align-items: stretch; }
            .donut-wrap { margin: 0 auto; }
            .frm-switches { grid-template-columns: 1fr 1fr; }
            .stats-summary { grid-template-columns: 1fr; }
        }
        @media (max-width: 600px) {
            .rec-grid { grid-template-columns: 1fr; }
            .frm-grid, .frm-grid.c4, .frm-switches { grid-template-columns: 1fr; }
            .statrow, .statrow.c4 { grid-template-columns: repeat(2, 1fr); }
            .pg-head h1 { font-size: 19px; }
            .toolbar .btns { width: 100%; }
        }

        /* 过渡动画 */
        .fade-enter-active, .fade-leave-active { transition: opacity 0.22s ease, transform 0.22s ease; }
        .fade-enter-from, .fade-leave-to { opacity: 0; transform: translateY(8px); }
        .drop-enter-active, .drop-leave-active { transition: opacity 0.16s ease, transform 0.16s ease; }
        .drop-enter-from, .drop-leave-to { opacity: 0; transform: translateY(-5px); }
        .mod-enter-active, .mod-leave-active { transition: opacity 0.2s ease; }
        .mod-enter-from, .mod-leave-to { opacity: 0; }
        .slide-enter-active, .slide-leave-active { transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1); }
        .slide-enter-from, .slide-leave-to { transform: translateX(100%); }
    </style>
</head>

        <div v-if="globalPreview.visible" class="img-preview" @click="globalPreview.visible = false">
            <img :src="globalPreview.src" alt="直播画面预览">
        </div>
    </template>
</div>

<script>
    let _cryptoKey = null;
    let _sessionId = null;
    let _aesKeyBytes = null;
    let securityPromise = null;

    /**
     * 解析并导入后端传来的 RSA 公钥 (SPKI 格式)
     * @param {string} base64Key Base64编码的RSA公钥
     * @returns {Promise<CryptoKey>} 返回可用于加密的 Web Crypto API 密钥对象
     */
    async function importRSAPublicKey(base64Key) {
        const binaryDer = window.atob(base64Key);
        const bytes = new Uint8Array(binaryDer.length);
        for (let i = 0; i < binaryDer.length; i++) {
            bytes[i] = binaryDer.charCodeAt(i);
        }
        return await crypto.subtle.importKey(
            "spki",
            bytes.buffer,
            {name: "RSA-OAEP", hash: "SHA-256"},
            false,
            ["encrypt"]
        );
    }

    /**
     * 核心安全初始化：与服务端进行非对称握手并申请专属 AES 加密隧道
     * @returns {Promise<void>} 握手完成的 Promise 信号
     */
    async function initSecurity() {
        if (securityPromise) return securityPromise;
        securityPromise = (async () => {
            try {
                // 1. 从服务器拉取随机生成的 RSA 公钥
                const res = await fetch('/api/v1/sec/pubkey');
                const pubKeyData = await res.json();

                // 将后端返回的 enabled 状态保存到前端全局变量
                window._encryptionEnabled = pubKeyData.data.enabled;

                if (!window._encryptionEnabled) {
                    console.log("🔓 [SEC] 后端已关闭传输加密，切换为明文直连模式");
                    _sessionId = "plaintext-" + Date.now();
                    return;
                }

                const rsaPubKey = await importRSAPublicKey(pubKeyData.data.pubkey);

                // 2. 在浏览器本地随机生成 32 字节的高强度 AES-256 密钥
                _aesKeyBytes = crypto.getRandomValues(new Uint8Array(32));
                _cryptoKey = await crypto.subtle.importKey("raw", _aesKeyBytes, {name: "AES-GCM"}, false, ["encrypt", "decrypt"]);

                // 3. 使用 RSA-OAEP 公钥加密该 AES 密钥
                const encryptedAesKeyBuf = await crypto.subtle.encrypt({name: "RSA-OAEP"}, rsaPubKey, _aesKeyBytes);
                const encryptedAesKeyB64 = window.btoa(String.fromCharCode(...new Uint8Array(encryptedAesKeyBuf)));

                // 4. 将加密后的 AES 密钥发送给后端，换取本会话独有的 Session ID
                const exRes = await fetch('/api/v1/sec/exchange', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({enc_key: encryptedAesKeyB64})
                });
                const exData = await exRes.json();
                _sessionId = exData.data.session_id;
                console.log("🛡️ [SEC] RSA+AES 动态密钥安全隧道建立完成!");
            } catch (e) {
                console.error("安全隧道建立失败:", e);
                if (window.uiToast) window.uiToast('error', '无法建立安全通信信道，请刷新页面重试');
            }
        })();
        return securityPromise;
    }

    /**
     * 获取 AES 密钥，若未初始化隧道则自动触发安全握手协议
     * @returns {Promise<CryptoKey|null>} 会话专属 AES 密钥
     */
    async function getCryptoKey() {
        if (!_cryptoKey && window._encryptionEnabled) await initSecurity();
        return _cryptoKey;
    }

    /**
     * AES-256-GCM 动态载荷加密函数：生成密文供网络层安全传输
     * @param {string} plaintext 准备加密的明文 JSON 字符串
     * @returns {Promise<string>} Base64 编码的密文结果
     */
    async function encryptPayload(plaintext) {
        const key = await getCryptoKey();
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const encoded = new TextEncoder().encode(plaintext);
        const ciphertextBuffer = await crypto.subtle.encrypt({name: "AES-GCM", iv: iv}, key, encoded);
        const ciphertext = new Uint8Array(ciphertextBuffer);
        const combined = new Uint8Array(iv.length + ciphertext.length);
        combined.set(iv);
        combined.set(ciphertext, iv.length);

        let binary = '';
        for (let i = 0; i < combined.byteLength; i++) {
            binary += String.fromCharCode(combined[i]);
        }
        return window.btoa(binary);
    }

    /**
     * AES-256-GCM 动态载荷解密函数：对服务端下发的加密报文进行解密
     * @param {string} base64Str Base64 编码的密钥载荷
     * @returns {Promise<string>} 解密后的原始明文字符串
     */
    async function decryptPayload(base64Str) {
        const key = await getCryptoKey();
        const binary = window.atob(base64Str);
        const combined = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) {
            combined[i] = binary.charCodeAt(i);
        }
        const iv = combined.slice(0, 12);
        const ciphertext = combined.slice(12);
        const decryptedBuffer = await crypto.subtle.decrypt({name: "AES-GCM", iv: iv,}, key, ciphertext);
        return new TextDecoder().decode(decryptedBuffer);
    }

    /* ================================================================
       轻量 UI 基件（纯 DOM，脱离 Vue 生命周期，供加密层/拦截器/全局使用）
       ================================================================ */
    const _UI_ICONS = {
        success: '<svg class="ic"><use href="#i-check-c"/></svg>',
        error: '<svg class="ic"><use href="#i-x-c"/></svg>',
        warning: '<svg class="ic"><use href="#i-alert"/></svg>',
        info: '<svg class="ic"><use href="#i-info"/></svg>'
    };

    function _uiHost(cls) {
        let host = document.querySelector('.' + cls);
        if (!host) {
            host = document.createElement('div');
            host.className = cls;
            document.body.appendChild(host);
        }
        return host;
    }

    /**
     * 顶部药丸 Toast（替代 Arco Message）
     */
    window.uiToast = function (type, text) {
        const host = _uiHost('toasts');
        const el = document.createElement('div');
        el.className = 'toast ' + (type || 'info');
        el.innerHTML = (_UI_ICONS[type] || _UI_ICONS.info) + '<span></span>';
        el.querySelector('span').textContent = String(text || '');
        host.appendChild(el);
        setTimeout(() => {
            el.classList.add('out');
            setTimeout(() => el.remove(), 300);
        }, type === 'error' ? 4200 : 2800);
        // 最多同屏 5 条，防止刷屏
        while (host.children.length > 5) host.firstChild.remove();
    };

    /**
     * 右下角通知卡（替代 Arco Notification，duration=0 表示常驻需手动关闭）
     */
    window.uiNotify = function (level, opts) {
        opts = opts || {};
        const host = _uiHost('notifies');
        const el = document.createElement('div');
        el.className = 'notify ' + (level || 'info');
        const hd = document.createElement('div');
        hd.className = 'hd';
        hd.innerHTML = (_UI_ICONS[level] || _UI_ICONS.info) + '<span class="tt"></span>';
        hd.querySelector('.tt').textContent = String(opts.title || '');
        if (opts.duration !== 0) {
            const xb = document.createElement('button');
            xb.className = 'x';
            xb.textContent = '×';
            xb.onclick = () => dismiss();
            hd.appendChild(xb);
        }
        const bd = document.createElement('div');
        bd.className = 'bd';
        bd.textContent = String(opts.content || '');
        el.appendChild(hd);
        el.appendChild(bd);
        host.appendChild(el);
        while (host.children.length > 6) host.firstChild.remove();

        let timer = null;
        function dismiss() {
            if (timer) clearTimeout(timer);
            el.classList.add('out');
            setTimeout(() => el.remove(), 300);
        }

        if (opts.duration !== 0) {
            timer = setTimeout(dismiss, opts.duration || 4500);
        }
    };

    const _escHtml = (s) => String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

    /**
     * 模态确认框（替代 Arco Modal.confirm / Modal.info）
     * opts: {title, content, html, okText, cancelText, danger, hideCancel, onOk}
     */
    window.uiConfirm = function (opts) {
        opts = opts || {};
        const mask = document.createElement('div');
        mask.className = 'xmod-mask';
        const card = document.createElement('div');
        card.className = 'xmod-card';
        card.style.width = '430px';
        let inner = '';
        if (opts.html) {
            inner += opts.html;
        } else {
            if (opts.title) inner += '<div class="cf-title">' + _escHtml(opts.title) + '</div>';
            if (opts.content) inner += '<div class="cf-text">' + _escHtml(opts.content) + '</div>';
        }
        card.innerHTML = '<div class="xmod-body">' + inner + '</div>' +
            '<div class="xmod-foot">' +
            (opts.hideCancel ? '' : '<button class="pill" data-act="cancel">' + _escHtml(opts.cancelText || '取消') + '</button>') +
            '<button class="pill ' + (opts.danger ? 'danger' : 'primary') + '" data-act="ok">' + _escHtml(opts.okText || '确定') + '</button>' +
            '</div>';
        mask.appendChild(card);
        document.body.appendChild(mask);
        mask.addEventListener('click', (e) => {
            if (e.target === mask) close();
        });

        function close() {
            mask.style.opacity = '0';
            mask.style.transition = 'opacity 0.18s ease';
            setTimeout(() => mask.remove(), 190);
        }

        card.querySelector('[data-act="cancel"]') && card.querySelector('[data-act="cancel"]').addEventListener('click', close);
        card.querySelector('[data-act="ok"]').addEventListener('click', async () => {
            const btn = card.querySelector('[data-act="ok"]');
            btn.disabled = true;
            try {
                if (opts.onOk) await opts.onOk();
                close();
            } catch (e) {
                btn.disabled = false;
            }
        });
    };
</script>

<script>
    const {createApp, ref, reactive, onMounted, onUnmounted, computed, watch, nextTick} = Vue;

    /* ---------- Arco 替身：与旧调用点保持同形 API ---------- */
    const Message = {
        success: (t) => window.uiToast('success', t),
        error: (t) => window.uiToast('error', t),
        warning: (t) => window.uiToast('warning', t),
        info: (t) => window.uiToast('info', t),
        loading: (t) => window.uiToast('info', t)
    };
    const Notification = {
        success: (o) => window.uiNotify('success', o),
        error: (o) => window.uiNotify('error', o),
        warning: (o) => window.uiNotify('warning', o),
        info: (o) => window.uiNotify('info', o)
    };
    const Modal = {
        confirm(opts) { window.uiConfirm(opts); },
        info(opts) { window.uiConfirm(Object.assign({hideCancel: true, okText: '知道了'}, opts || {})); }
    };

    const api = axios.create({baseURL: '/api/v1', timeout: 10000});

    /**
     * Axios 响应拦截器：自动拦截后端报文，触发专属 AES 密钥解密，并统一下发错误反馈
     */
    api.interceptors.response.use(
        async res => {
            let data = res.data;
            if (window._encryptionEnabled && data && data.encrypted) {
                try {
                    const decryptedStr = await decryptPayload(data.encrypted);
                    data = JSON.parse(decryptedStr);
                } catch (e) {
                    Message.error('动态解密失败，数据可能被劫持或密钥过期');
                    return Promise.reject(new Error('Decrypt failed'));
                }
            }
            if (data.code !== 200) {
                // 如果后端告知 Session 不合法/过期，清空重连
                if (data.code === 401 && data.message === 'Session Invalid') {
                    _sessionId = null;
                    _cryptoKey = null;
                    securityPromise = null;
                    window.location.reload();
                }
                Message.error(data.message || '请求失败');
                return Promise.reject(new Error(data.message));
            }
            return data;
        },
        async err => {
            if (err.response && err.response.status === 401) {
                if (err.response.data && err.response.data.message === 'Session Invalid') {
                    _sessionId = null;
                    _cryptoKey = null;
                    securityPromise = null;
                } else {
                    localStorage.removeItem('upload_system_token');
                }
                window.location.reload();
            }
            if (window._encryptionEnabled && err.response && err.response.data && err.response.data.encrypted) {
                try {
                    const decryptedStr = await decryptPayload(err.response.data.encrypted);
                    err.response.data = JSON.parse(decryptedStr);
                } catch (e) {
                }
            }
            Message.error(err.response?.data?.message || err.message || '网络错误');
            return Promise.reject(err);
        }
    );

    /**
     * Axios 请求拦截器：确保握手完成后携带专属 SessionID，并自动对载荷进行安全封装密文
     */
    api.interceptors.request.use(async config => {
        if (!_sessionId) await initSecurity();
        config.headers['X-Session-Id'] = _sessionId;

        const token = localStorage.getItem('upload_system_token');
        if (token) config.headers['Authorization'] = `Bearer ${token}`;

        if (config.data && !(config.data instanceof FormData)) {
            if (window._encryptionEnabled) {
                const rawJson = JSON.stringify(config.data);
                const encryptedStr = await encryptPayload(rawJson);
                config.data = {encrypted: encryptedStr};
                config.headers['X-Encryption-Mode'] = 'AES-256-GCM';
            } else {
                config.headers['X-Encryption-Mode'] = 'Plaintext';
            }
        }
        return config;
    });

    /* ================================================================
       自定义 UI 组件（替代 Arco：Switch / Select / Pagination / Modal / Drawer / Menu）
       ================================================================ */
    const XSwitch = {
        name: 'XSwitch',
        props: {
            modelValue: {type: Boolean, default: false},
            disabled: {type: Boolean, default: false},
            loading: {type: Boolean, default: false}
        },
        emits: ['update:modelValue', 'change'],
        methods: {
            toggle() {
                if (this.disabled || this.loading) return;
                this.$emit('update:modelValue', !this.modelValue);
                this.$emit('change', !this.modelValue);
            }
        },
        template: `<button type="button" class="xsw" :class="{'is-on': modelValue, 'is-loading': loading, 'is-disabled': disabled || loading}" role="switch" :aria-checked="String(modelValue)" @click="toggle">
            <span class="knob">
                <svg v-if="loading" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 9 9"/></svg>
            </span>
        </button>`
    };

    const XSelect = {
        name: 'XSelect',
        props: {
            modelValue: {type: [String, Number], default: ''},
            options: {type: Array, default: () => []},
            placeholder: {type: String, default: '请选择'},
            width: {type: String, default: ''},
            disabled: {type: Boolean, default: false}
        },
        emits: ['update:modelValue', 'change'],
        data() {
            return {open: false, dropUp: false};
        },
        computed: {
            current() {
                return this.options.find(o => o.value === this.modelValue);
            }
        },
        methods: {
            toggle() {
                if (this.disabled) return;
                this.open = !this.open;
                if (this.open) {
                    this.$nextTick(() => {
                        const el = this.$el;
                        if (el && el.getBoundingClientRect().bottom + 270 > window.innerHeight) this.dropUp = true;
                        else this.dropUp = false;
                    });
                }
            },
            pick(opt) {
                this.open = false;
                if (opt.value !== this.modelValue) {
                    this.$emit('update:modelValue', opt.value);
                    this.$emit('change', opt.value);
                }
            },
            onDocClick(e) {
                if (this.$el && !this.$el.contains(e.target)) this.open = false;
            },
            onEsc(e) {
                if (e.key === 'Escape') this.open = false;
            }
        },
        mounted() {
            document.addEventListener('click', this.onDocClick);
            document.addEventListener('keydown', this.onEsc);
        },
        unmounted() {
            document.removeEventListener('click', this.onDocClick);
            document.removeEventListener('keydown', this.onEsc);
        },
        template: `<div class="xsel" :class="{'is-open': open, 'is-disabled': disabled}" :style="width ? {width: width} : {}">
            <button type="button" class="xsel-btn" style="width:100%;" @click="toggle">
                <span :class="{ph: !current}" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{ current ? current.label : placeholder }}</span>
                <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9.5l6 6 6-6"/></svg>
            </button>
            <transition name="drop">
                <div v-if="open" class="xsel-pop" :class="{up: dropUp}">
                    <div v-for="o in options" :key="o.value" class="xsel-opt" :class="{'is-on': o.value === modelValue}" @click="pick(o)">
                        <span>{{ o.label }}</span>
                        <svg v-if="o.value === modelValue" class="ic" viewBox="0 0 24 24"><use href="#i-check"/></svg>
                    </div>
                </div>
            </transition>
        </div>`
    };

    const XPagination = {
        name: 'XPagination',
        props: {
            total: {type: Number, default: 0},
            pageSize: {type: Number, default: 12},
            page: {type: Number, default: 1}
        },
        emits: ['update:page'],
        computed: {
            pagesMax() { return Math.max(1, Math.ceil(this.total / this.pageSize)); },
            items() {
                const cur = this.page, max = this.pagesMax, out = [];
                if (max <= 7) {
                    for (let i = 1; i <= max; i++) out.push(i);
                    return out;
                }
                out.push(1);
                if (cur > 3) out.push('…');
                for (let i = Math.max(2, cur - 1); i <= Math.min(max - 1, cur + 1); i++) out.push(i);
                if (cur < max - 2) out.push('…');
                out.push(max);
                return out;
            }
        },
        methods: {
            go(p) {
                if (p === '…' || p < 1 || p > this.pagesMax || p === this.page) return;
                this.$emit('update:page', p);
            }
        },
        template: `<div class="xpg" v-if="pagesMax > 1">
            <button :disabled="page <= 1" @click="go(page - 1)" title="上一页">
                <svg class="ic" style="width:13px;height:13px;" viewBox="0 0 24 24"><use href="#i-chev-l"/></svg>
            </button>
            <button v-for="(p, i) in items" :key="i" :class="{on: p === page, gap: p === '…'}" :disabled="p === '…'" @click="go(p)">{{ p }}</button>
            <button :disabled="page >= pagesMax" @click="go(page + 1)" title="下一页">
                <svg class="ic" style="width:13px;height:13px;" viewBox="0 0 24 24"><use href="#i-chev-r"/></svg>
            </button>
        </div>`
    };

    const XModal = {
        name: 'XModal',
        props: {
            visible: {type: Boolean, default: false},
            title: {type: String, default: ''},
            width: {type: String, default: '520px'}
        },
        emits: ['update:visible'],
        watch: {
            visible(v) {
                if (v) {
                    this._prevOverflow = document.body.style.overflow;
                    document.body.style.overflow = 'hidden';
                } else {
                    document.body.style.overflow = this._prevOverflow || '';
                }
            }
        },
        methods: {
            close() { this.$emit('update:visible', false); },
            onKey(e) { if (e.key === 'Escape' && this.visible) this.close(); }
        },
        mounted() { document.addEventListener('keydown', this.onKey); },
        unmounted() {
            document.removeEventListener('keydown', this.onKey);
            document.body.style.overflow = '';
        },
        template: `<transition name="mod">
            <div v-if="visible" class="xmod-mask" @click.self="close()">
                <div class="xmod-card" :style="{width: width, maxWidth: '96vw'}">
                    <div class="xmod-head">
                        <h3>{{ title }}</h3>
                        <button class="xmod-x" @click="close()">
                            <svg class="ic" style="width:13px;height:13px;" viewBox="0 0 24 24"><use href="#i-x"/></svg>
                        </button>
                    </div>
                    <div class="xmod-body"><slot></slot></div>
                    <div v-if="$slots.footer" class="xmod-foot"><slot name="footer"></slot></div>
                </div>
            </div>
        </transition>`
    };

    const XDrawer = {
        name: 'XDrawer',
        props: {
            visible: {type: Boolean, default: false},
            width: {type: String, default: '480px'}
        },
        emits: ['update:visible'],
        watch: {
            visible(v) {
                if (v) {
                    this._prevOverflow = document.body.style.overflow;
                    document.body.style.overflow = 'hidden';
                } else {
                    document.body.style.overflow = this._prevOverflow || '';
                }
            }
        },
        methods: {
            close() { this.$emit('update:visible', false); },
            onKey(e) { if (e.key === 'Escape' && this.visible) this.close(); }
        },
        mounted() { document.addEventListener('keydown', this.onKey); },
        unmounted() {
            document.removeEventListener('keydown', this.onKey);
            document.body.style.overflow = '';
        },
        template: `<transition name="mod">
            <div v-if="visible">
                <div class="xdrw-mask" @click="close()"></div>
                <transition name="slide" appear>
                    <div class="xdrw" :style="{width: width}">
                        <div class="xdrw-body"><slot></slot></div>
                        <div class="xdrw-foot"><slot name="footer"></slot></div>
                    </div>
                </transition>
            </div>
        </transition>`
    };

    const XMenu = {
        name: 'XMenu',
        emits: [],
        data() { return {open: false, dropUp: false}; },
        methods: {
            toggle() {
                this.open = !this.open;
                if (this.open) {
                    // 触发器贴近视口底部时向上翻，避免菜单被卡片/视口下边缘裁掉
                    this.$nextTick(() => {
                        const el = this.$el;
                        const pop = this.$refs.pop;
                        if (!el) return;
                        const r = el.getBoundingClientRect();
                        const h = pop ? pop.offsetHeight : 170;
                        this.dropUp = (window.innerHeight - r.bottom) < (h + 12) && r.top > (h + 12);
                    });
                }
            },
            onDocClick(e) {
                if (this.$el && !this.$el.contains(e.target)) this.open = false;
            },
            itemClick(handler) {
                if (handler) handler();
                this.open = false;
            }
        },
        mounted() { document.addEventListener('click', this.onDocClick); },
        unmounted() { document.removeEventListener('click', this.onDocClick); },
        template: `<div class="xmenu" @click.stop>
            <span @click="toggle"><slot name="trigger"></slot></span>
            <transition name="drop">
                <div v-if="open" ref="pop" class="xmenu-pop" :class="{up: dropUp}"><slot></slot></div>
            </transition>
        </div>`
    };

    const app = createApp({
        errorHandler(err, instance, info) {
            console.error('[前端渲染异常]', info, err);
        },
        setup() {

            const builtinUploadTaskKeyOf = (t) => (t ? String(t.platform || '') + '_' + String(t.room_id || '') : '');
            const builtinUploadMap = computed(() => {
                const map = new Map();
                const tasks = builtinTasks.value || [];
                const ups = liveTasks.value || [];
                if (!tasks.length || !ups.length) return map;
                for (const t of tasks) {
                    const name = t.anchor_name && t.anchor_name !== t.room_id ? String(t.anchor_name) : '';
                    const rid = t.room_id ? String(t.room_id) : '';
                    if (!name && rid.length < 4) continue;
                    let best = null;
                    for (const u of ups) {
                        const fn = String(u && u.filename || '');
                        if (!fn) continue;
                        if ((name && fn.includes(name)) || (rid.length >= 4 && fn.includes(rid))) {
                            if (!best || (u.startTime || 0) >= (best.startTime || 0)) best = u;
                        }
                    }
                    if (best) {
                        const st = String(best.status || '').toLowerCase();
                        if (st.includes('fail')) {
                            map.set(builtinUploadTaskKeyOf(t), {key: 'failed', text: '上传失败'});
                        } else if (st.includes('success')) {
                            map.set(builtinUploadTaskKeyOf(t), {key: 'synced', text: '已同步'});
                        } else if (st === 'uploading') {
                            const pct = best.size > 0 ? Math.min(99, Math.round((best.uploaded || 0) / best.size * 100)) : 0;
                            map.set(builtinUploadTaskKeyOf(t), {key: 'uploading', text: `上传中 ${pct}%`});
                        } else if (st === 'waiting') {
                            map.set(builtinUploadTaskKeyOf(t), {key: 'waiting', text: '排队归档中'});
                        }
                    }
                }
                return map;
            });
            // 抽屉内的上传记录列表（同一主播名匹配到的全部上传任务，最多 5 条）
            const recDrawerUploads = computed(() => {
                const record = recDrawer.record;
                if (!record) return [];
                const name = record.anchor_name && record.anchor_name !== record.room_id ? String(record.anchor_name) : '';
                const rid = record.room_id ? String(record.room_id) : '';
                return (liveTasks.value || [])
                    .filter(u => {
                        const fn = String(u && u.filename || '');
                        return fn && ((name && fn.includes(name)) || (rid.length >= 4 && fn.includes(rid)));
                    })
                    .sort((a, b) => (b.startTime || 0) - (a.startTime || 0))
                    .slice(0, 5);
            });
            const builtinUploadTaskView = (u) => {
                const total = u && u.size ? u.size : 0;
                const done = u && u.uploaded ? u.uploaded : 0;
                const pct = total > 0 ? Math.min(100, Math.round(done / total * 100)) : (u && String(u.status).includes('success') ? 100 : 0);
                const st = String(u && u.status || '').toLowerCase();
                if (st.includes('fail')) return {key: 'failed', text: '上传失败', pct, bar: 'orange'};
                if (st.includes('success')) return {key: 'synced', text: '已同步', pct, bar: ''};
                if (st === 'uploading') return {key: 'uploading', text: `上传中 ${formatSpeed(u.speed || 0)}`, pct, bar: ''};
                if (st === 'waiting') return {key: 'waiting', text: '等待上传', pct, bar: ''};
                return {key: 'waiting', text: st || '—', pct, bar: ''};
            };

            // 筛选态与范围文案

                if (!total) return '';

            // 卡片「更多」菜单动作

                try {
                    if (navigator.clipboard && window.isSecureContext) {
                        await navigator.clipboard.writeText(url);
                    } else {
                        const ta = document.createElement('textarea');
                        ta.value = url;
                        ta.style.position = 'fixed';
                        ta.style.opacity = '0';
                        document.body.appendChild(ta);
                        ta.select();
                        document.execCommand('copy');
                        document.body.removeChild(ta);

            /**

                if (platform === 'Bilibili') return `https://live.bilibili.com/${roomId}`;

            /**

            const downloadBuiltinCover = async (url, anchorName) => {
                try {
                    const response = await fetch(url);
                    const blob = await response.blob();
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    const safeName = (anchorName || '未命名主播').replace(/[/\\?%*:|"<>]/g, '-');
                    link.download = `${safeName}_封面图_${Date.now()}.png`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(link.href);
                    Message.success('封面图片已开始下载');

            const wmColorHex = computed(() => {

                const c = String(builtinSettings.value.watermark_font_color || '#FFFFFFE6').replace('#', '');

            const onWmColor = (e) => {
                const hex = e.target.value.replace('#', '').toUpperCase();

                builtinAdding.value = true;
                try {
                    // 添加接口需等后台解析短链（Chrome/HTTP 兜底），放宽到 30s 避免前端先超时
                    await api.post('/builtin_recorder/add', builtinForm.value, {timeout: 30000});
                    setBuiltinAddFeedback('success', '添加成功，引擎正在初始化监控');
                    Message.success("任务添加成功");
                    builtinForm.value.url = '';
                } catch (e) {
                    setBuiltinAddFeedback('error', (e && e.response && e.response.data && e.response.data.message) || e.message || '添加失败，请检查链接后重试');
                } finally {
                    builtinAdding.value = false;

            };

            const handleBatchAddBuiltin = async () => {
                const lines = builtinBatchForm.value.urls.split('\n').map(l => l.trim()).filter(l => l !== '');
                if (lines.length === 0) {
                    Message.warning("内容为空");
                    return;
                }
                if (lines.length > 50) {
                    Message.error('单次最多添加 50 个');
                    return;
                }
                builtinBatchAdding.value = true;
                let success = 0, fail = 0;
                for (const url of lines) {
                    try {
                        await api.post('/builtin_recorder/add', {platform: builtinBatchForm.value.platform, url: url}, {timeout: 30000});
                        success++;
                    } catch (e) {
                        fail++;
                    }
                }
                builtinBatchAdding.value = false;
                if (fail === 0) {
                    Message.success(`成功批量添加 ${success} 个任务`);
                    builtinBatchForm.value.urls = '';

            let composingEl = null;

                const el = e.target;
                if (!el || (el.tagName !== 'INPUT' && el.tagName !== 'TEXTAREA')) return;
                if (e.type === 'compositionstart') {
                    if (composingEl === el) return;
                    if (composingEl) {
                        delete composingEl.value;
                    }
                    composingEl = el;
                    const proto = el.tagName === 'INPUT'
                        ? HTMLInputElement.prototype
                        : HTMLTextAreaElement.prototype;
                    const desc = Object.getOwnPropertyDescriptor(proto, 'value');
                    Object.defineProperty(el, 'value', {
                        get() { return desc.get.call(this); },
                        set() {

            };

            /**
             * 接受来自后台加密通道推送的数据触发点，令前端图标产生 CSS 脉冲动画特效以示心跳通信正在发生
             */
            const triggerWsPulse = (eventType) => {
                wsStats.msgCount++;
                wsStats.lastEvent = eventType;
                wsStats.pulse = true;
                if (wsPulseTimeout) clearTimeout(wsPulseTimeout);
                wsPulseTimeout = setTimeout(() => {
                    wsStats.pulse = false;
                }, 150);
            };

            let reconnectAttempts = 0;
            const maxReconnectDelay = 30000;
            const baseReconnectDelay = 2000;

            /**
             * 构建全功能的 WebSocket 客户端信道，并封装断线重连、密文解码鉴别与心跳存活自动确认处理机
             */
            const connectWS = async () => {
                // 已登出（或 token 被清）时不再建立连接：否则登出后挂起的重连定时器仍会拿旧 token 反复握手
                if (!isLoggedIn.value || !localStorage.getItem('upload_system_token')) return;

                if (window._encryptionEnabled && !_sessionId) {
                    await initSecurity();
                }

                if (ws) {
                    ws.onclose = null;
                    ws.close();
                }
                wsStatus.value = 'connecting';
                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';

                let wsUrl = `${protocol}//${window.location.host}/ws/live`;
                if (window._encryptionEnabled && _sessionId) {
                    wsUrl += `?session_id=${_sessionId}`;
                }
                // 安全审计修复：WS 握手无法携带自定义请求头，改用查询参数传递登录令牌
                wsUrl += (wsUrl.includes('?') ? '&' : '?') + `token=${encodeURIComponent(localStorage.getItem('upload_system_token') || '')}`;

                ws = new WebSocket(wsUrl);

                lastPongTime = Date.now();

                ws.onopen = () => {
                    wsStatus.value = 'connected';
                    lastPongTime = Date.now();
                    reconnectAttempts = 0;

                    if (pingTimer) clearInterval(pingTimer);
                    pingTimer = setInterval(async () => {
                        if (ws.readyState === WebSocket.OPEN) {
                            if (Date.now() - lastPongTime > 15000) {
                                console.warn("[WS] 心跳超时，连接已假死，强制触发断开重连...");
                                ws.close();
                                return;
                            }
                            const pingRaw = JSON.stringify({type: 'ping', payload: Date.now()});

                            if (window._encryptionEnabled && _cryptoKey) {
                                const encryptedPing = await encryptPayload(pingRaw);
                                ws.send(JSON.stringify({encrypted: encryptedPing}));
                            } else {
                                ws.send(pingRaw);
                            }
                        }
                    }, 5000);
                };

                ws.onmessage = async (event) => {
                    try {
                        lastPongTime = Date.now();

                        let msgObj = JSON.parse(event.data);

                        if (window._encryptionEnabled && msgObj.encrypted) {
                            const decryptedStr = await decryptPayload(msgObj.encrypted);
                            msgObj = JSON.parse(decryptedStr);
                        }

                        const msg = msgObj;

                        if (msg.type === 'pong') {
                            wsLatency.value = Date.now() - msg.payload;
                            return;
                        }

                        triggerWsPulse(msg.type);

                        if (msg.type === 'systemAlert') {
                            const payload = msg.payload;
                            window.uiNotify(payload.level || 'error', {
                                title: payload.title,
                                content: payload.message + `\n\n触发时间: ${payload.time}`,
                                duration: 0
                            });
                        } else if (msg.type === 'trafficMetrics') {
                            trafficMetrics.speed = msg.payload.speed;
                            trafficMetrics.time = msg.payload.time;
                        } else if (msg.type === 'statsTrend') {
                            const newStr = JSON.stringify(msg.payload);
                            if (window.lastStatsStr !== newStr) {
                                window.lastStatsStr = newStr;
                                statsData.trend = msg.payload.trend || [];
                                statsData.rank = msg.payload.rank || [];
                                if (activeTab.value === 'overview' && statsData.trend.length > 0) {
                                    nextTick(() => renderTrendChart());
                                }
                            }
                        } else if (msg.type === 'recorderStatus') {
                            recorderStatus.value = msg.payload;
                        } else if (msg.type === 'activeStreamers') {
                            activeRecordingStreamers.value = msg.payload || [];
                        } else if (msg.type === 'streamersData') {
                            if (!isSavingStreamers.value) {
                                const newStr = JSON.stringify(msg.payload);
                                if (window.lastStreamersStr !== newStr) {
                                    streamers.value = msg.payload;
                                    window.lastStreamersStr = newStr;
                                }
                            }
                        } else if (msg.type === 'uploadProgress') {
                            const idx = liveTasks.value.findIndex(t => t.id === msg.payload.id);
                            if (idx > -1) {
                                liveTasks.value[idx].uploaded = msg.payload.uploaded;
                                liveTasks.value[idx].speed = msg.payload.speed;
                                liveTasks.value[idx].status = msg.payload.status;
                            } else {
                                liveTasks.value.unshift({
                                    id: msg.payload.id, filename: msg.payload.filename, path: msg.payload.path,
                                    size: msg.payload.size, uploaded: msg.payload.uploaded, speed: msg.payload.speed,
                                    status: msg.payload.status, startTime: msg.payload.startTime, duration: 0
                                });
                            }
                        } else if (msg.type === 'systemStatus') {
                            Object.assign(systemStatus, msg.payload);
                        } else if (msg.type === 'queueStatus') {
                            Object.assign(queueStatus, msg.payload);
                        } else if (msg.type === 'taskDone') {
                            const idx = liveTasks.value.findIndex(t => t.id === msg.payload.id);
                            if (idx > -1) {
                                liveTasks.value[idx].status = msg.payload.status;
                                if (msg.payload.progress === 100) liveTasks.value[idx].uploaded = liveTasks.value[idx].size;
                                if (msg.payload.error) liveTasks.value[idx].error = msg.payload.error;
                            }
                            if (activeTab.value === 'history') fetchHistory();
                        } else if (msg.type === 'newLog') {
                            const log = msg.payload;
                            if (logQuery.page === 1 && !logQuery.keyword && (!logQuery.level || logQuery.level === log.level)) {
                                logData.items.unshift(log);
                                logData.total++;
                                if (logData.items.length > logQuery.limit) {
                                    logData.items.pop();
                                }
                            }
                        } else if (msg.type === 'scanStarted') {
                            let titleText = '📡 系统扫描已启动';
                            let contentText = `当前并发：${msg.payload.workers} 个线程\n扫描目标：共 ${msg.payload.dirs.length} 个目录`;
                            if (msg.payload.trigger === 'auto') {
                                titleText = '⏱️ 定时扫描执行中';
                                contentText = `定时周期：${msg.payload.interval} 分钟/次\n` + contentText;
                            } else if (msg.payload.trigger === 'start') {
                                titleText = '▶️ 系统已恢复运行';
                            } else if (msg.payload.trigger === 'rescan') {
                                titleText = '🔍 手动深度扫描启动';
                            } else if (msg.payload.trigger === 'config-update') {
                                titleText = '⚙️ 配置重载扫描';
                            }
                            window.uiNotify('info', {title: titleText, content: contentText, duration: 4000});
                        } else if (msg.type === 'scanFinished') {
                            window.uiNotify('success', {
                                title: '✅ 扫描侦测完毕',
                                content: `本轮深度比对完成，共发现并压入 ${msg.payload.added} 个新文件至队列中。`,
                                duration: 4000
                            });
                        } else if (msg.type === 'builtinTasks') {
                            builtinLastSync.value = Date.now();
                            // ✨ 性能优化修改点：处理后端海量推送时的视觉静默拦截
                            const payloadTasks = msg.payload || [];

                            // 1. 从原数组中移除后端已经不存在的任务
                            for (let i = builtinTasks.value.length - 1; i >= 0; i--) {
                                const exists = payloadTasks.find(t => t.platform === builtinTasks.value[i].platform && t.room_id === builtinTasks.value[i].room_id);
                                if (!exists) {
                                    builtinTasks.value.splice(i, 1);
                                }
                            }

                            // 2. 更新存在的任务，或将新任务追加到原数组
                            payloadTasks.forEach(pTask => {
                                const existing = builtinTasks.value.find(t => t.platform === pTask.platform && t.room_id === pTask.room_id);
                                if (existing) {
                                    // 原地合并属性
                                    existing.anchor_name = pTask.anchor_name;
                                    existing.status = pTask.status;
                                    existing.duration = pTask.duration;
                                    existing.file_size = pTask.file_size;
                                    existing.is_paused = pTask.is_paused;
                                    // 单主播截图间隔/水印/画质/时长/时段覆盖：后端每次全量快照都带最新值
                                    existing.shot_interval = pTask.shot_interval || 0;
                                    existing.watermark = pTask.watermark || 0;
                                    existing.quality_override = pTask.quality_override || '';
                                    existing.max_duration = pTask.max_duration || 0;
                                    existing.segment_time = pTask.segment_time || 0;
                                    existing.window = pTask.window || '';

                                    // 【核心流量拦截】只有在页面可见且停留在当前 Tab 时，才主动更新 DOM 触发浏览器图片拉取
                                    if (isPageVisible.value && activeTab.value === 'builtin_recorder') {
                                        existing.avatar = pTask.avatar;
                                        if (globalPreview.visible && globalPreview.platform === pTask.platform && globalPreview.roomId === pTask.room_id) {
                                            globalPreview.src = pTask.avatar;
                                        }
                                    } else {
                                        // 【核心流量拦截】将未渲染的最新地址暂存在内存缓冲变量里
                                        existing._pending_avatar = pTask.avatar;
                                    }
                                } else {
                                    pTask.switching = false;
                                    // 【核心流量拦截】初次载入时也要判断是否应该加载图片
                                    if (!(isPageVisible.value && activeTab.value === 'builtin_recorder')) {
                                        pTask._pending_avatar = pTask.avatar;
                                        pTask.avatar = null;
                                    }
                                    builtinTasks.value.push(pTask);
                                }
                            });
                        }
                    } catch (e) {
                        console.error("解密流数据发生异常：", e);
                    }
                };

                ws.onclose = () => {
                    wsStatus.value = 'disconnected';
                    wsLatency.value = 0;
                    if (pingTimer) clearInterval(pingTimer);

                    if (isLoggedIn.value) {
                        const delay = Math.min(
                            maxReconnectDelay,
                            baseReconnectDelay * Math.pow(1.5, reconnectAttempts)
                        ) + (Math.random() * 1000);

                        reconnectAttempts++;

                        console.warn(`[WS] 连接断开，将在 ${(delay / 1000).toFixed(1)} 秒后进行第 ${reconnectAttempts} 次重连...`);
                        setTimeout(connectWS, delay);

            };

            /**
             * 对系统状态发起干预操作的事件，并对诸如系统起停指令予以强弹窗提醒用户防手滑拦截

            const control = (action) => {

            const fetchHistory = async () => {
                try {
                    const res = await api.get('/tasks/history', {params: historyQuery});

            const fetchLogs = async () => {
                try {
                    const res = await api.get('/logs', {params: logQuery});

            const downloadLogs = async () => {
                try {
                    // level/keyword 进查询串，必须编码，否则关键词里的空格、&、# 会截断参数
                    let url = `/api/v1/logs/download?limit=${logExportLimit.value}&level=${encodeURIComponent(logQuery.level || '')}&keyword=${encodeURIComponent(logQuery.keyword || '')}`;
                    if (window._encryptionEnabled) {
                        if (!_sessionId) await initSecurity();
                        url += `&session_id=${_sessionId}`;

                } catch (e) {
                    Message.error("日志导出失败: " + e.message);
                }
            };

            const fetchConfig = async () => {
                try {
                    const res = await api.get('/config');
                    configForm.value = res.data || {};
                    originalConfigSnapshot = JSON.parse(JSON.stringify(res.data || {}));
                    configDirsString.value = (res.data.dirs || []).join(', ');
                } catch (e) {
                }
            };

            const saveConfig = async () => {
