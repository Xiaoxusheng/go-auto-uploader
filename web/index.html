<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 保留缩放能力：禁用 user-scalable 会挡住移动端双指放大（无障碍问题） -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="referrer" content="no-referrer"/>

    <title>直播录制管理系统</title>
    <link rel="icon"
          href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
    <!-- 前端依赖自托管（随二进制发布），不走公网 CDN：离线可用、首屏无重定向延迟 -->
    <script src="/vendor/vue.global.prod.js"></script>
    <script src="/vendor/arco-vue.min.js"></script>
    <script src="/vendor/arco-vue-icon.min.js"></script>
    <script src="/vendor/axios.min.js"></script>
    <script src="/vendor/echarts.min.js"></script>
    <link href="/vendor/arco.min.css" rel="stylesheet">

    <style>
        html, body {
            max-width: 100vw;
            height: 100%;
            overflow: hidden;
            -webkit-text-size-adjust: 100%;
        }

        :root {
            --bg-base: #f0f2f5;
            --glass-bg: rgba(255, 255, 255, 0.75);
            --nav-glass-bg: #ffffff;
            --glass-border: rgba(0, 0, 0, 0.06);
            --hover-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
        }

        body[arco-theme='dark'] {
            --bg-base: #000000;
            --glass-bg: rgba(35, 35, 36, 0.65);
            --nav-glass-bg: #17171a;
            --glass-border: rgba(255, 255, 255, 0.12);
            --hover-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
        }

        body {
            background-color: var(--bg-base);
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            color: var(--color-text-1);
            transition: background-color 0.4s ease;
        }

        .apple-glass {
            background-color: var(--glass-bg) !important;
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-radius: 12px;
            transition: background-color 0.4s ease, border-color 0.4s ease;
        }

        .nav-glass {
            background-color: var(--nav-glass-bg) !important;
            border-bottom: 1px solid var(--color-border, #e5e6eb);
            position: sticky;
            top: 0;
            z-index: 1000;
            flex-shrink: 0;
        }

        .hover-effect {
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .hover-effect:hover {
            transform: translateY(-4px);
            box-shadow: var(--hover-shadow);
        }

        .fade-enter-active, .fade-leave-active {
            transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1), transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .fade-enter-from, .fade-leave-to {
            opacity: 0;
            transform: translateY(12px) scale(0.98);
        }

        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
        }

        @keyframes breathe {
            0% {
                transform: scale(0.9);
                box-shadow: 0 0 0 0 rgba(0, 180, 42, 0.4);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 0 12px 6px rgba(0, 180, 42, 0.15);
            }
            100% {
                transform: scale(0.9);
                box-shadow: 0 0 0 0 rgba(0, 180, 42, 0);
            }
        }

        .status-dot-connected {
            background-color: #00B42A;
            animation: breathe 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(0.9);
                opacity: 0.85;
            }
            50% {
                transform: scale(1.05);
                opacity: 1;
            }
            100% {
                transform: scale(0.9);
                opacity: 0.85;
            }
        }

        .status-dot-connecting {
            background-color: #165DFF;
            animation: pulse 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes flash-warning {
            0%, 100% {
                opacity: 1;
                background-color: #F53F3F;
                box-shadow: 0 0 8px rgba(245, 63, 63, 0.5);
            }
            50% {
                opacity: 0.5;
                background-color: #F53F3F;
                box-shadow: none;
            }
        }

        .status-dot-disconnected {
            background-color: #F53F3F;
            animation: flash-warning 1.5s ease-in-out infinite;
        }

        @keyframes wifi-wave {
            0% {
                opacity: 0.5;
                transform: scale(0.95);
            }
            50% {
                opacity: 1;
                transform: scale(1.05);
            }
            100% {
                opacity: 0.5;
                transform: scale(0.95);
            }
        }

        .ws-icon-connected {
            color: #00B42A !important;
            animation: wifi-wave 3.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        .ws-icon-connecting {
            color: #165DFF !important;
            animation: pulse 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        .ws-icon-disconnected {
            color: #F53F3F !important;
            opacity: 0.8 !important;
        }

        .ws-data-flash {
            color: #165DFF !important;
            filter: drop-shadow(0 0 14px rgba(22, 93, 255, 0.8));
            transform: scale(1.15) !important;
            transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1) !important;
        }

        #app {
            height: 100%;
            display: flex;
            flex-direction: column;
            width: 100%;
            overflow: hidden;
        }

        /* 整体固定为一屏：header / footer 定高，标签内容区吃掉剩余高度，
           内容超出时仅在内容区内部滚动（小屏兜底），页面级不再出现滚动条 */
        .main-container {
            padding: 8px 16px 6px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .main-container .arco-tabs {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .main-container .arco-tabs > .arco-tabs-nav {
            flex-shrink: 0;
        }

        .main-container .arco-tabs > .arco-tabs-content {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            padding-top: 6px;
        }

        /* 内容弹性填满：pane 定高 = 视口 - 外壳固定开销（顶栏/页签/底栏），
           内部再自行分配（图表拉伸/分页贴底），避免屏幕下部留大片空白。
           注意：绝不可改动 content-list / content-item 的 Arco 默认横向排列，
           否则页签切换动画的 margin-left 负百分比会把内容推出屏幕，导致整页空白 */
        .main-container .arco-tabs-content .arco-tabs-pane {
            height: calc(100vh - 128px);
            min-height: 420px;
            display: flex;
            flex-direction: column;
        }

        /* 概览页（首个页签）内容可超一屏：pane 改为自然高度，整体由内容区滚动。
           注意 Arco 的 DOM 层级是 content-list > content-item > pane，
           自定义 class 会落在 content-item 上；固定高度 pane 会让溢出内容滚不到 */
        .main-container .arco-tabs-content .arco-tabs-content-item.ov-pane > .arco-tabs-pane,
        .main-container .arco-tabs-content .arco-tabs-content-list > .arco-tabs-content-item:first-child > .arco-tabs-pane {
            height: auto;
            min-height: calc(100vh - 128px);
        }

        /* 内容区滚动但不显示滚动条（滚轮/触控板/触摸仍可正常滚动） */
        .main-container .arco-tabs > .arco-tabs-content {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .main-container .arco-tabs > .arco-tabs-content::-webkit-scrollbar {
            width: 0;
            height: 0;
            display: none;
        }

        /* 需要撑满到底的卡片 / 面板 */
        .pane-fill {
            flex: 1 1 auto;
            min-height: 0;
        }

        /* 页签导航统一视觉尺寸：高 34px / 圆角 6px / 等宽内边距；
           选中态用轻量 Primary（浅蓝底 + 蓝字），避免导航栏出现大面积彩底 */
        .main-container .arco-tabs-nav-type-rounded .arco-tabs-tab {
            height: 34px;
            padding: 0 14px;
            margin: 0 6px 0 0;
            border-radius: 6px;
            font-size: 13px;
            color: var(--color-text-2);
        }

        .main-container .arco-tabs-nav-type-rounded .arco-tabs-tab:hover {
            color: var(--color-text-1);
            background-color: var(--color-fill-2);
        }

        .main-container .arco-tabs-nav-type-rounded .arco-tabs-tab.arco-tabs-tab-active {
            color: var(--color-primary-6);
            background-color: var(--color-primary-light-1);
            font-weight: 500;
        }

        /* ========== 系统概览 Dashboard ========== */
        /* 概览页行间距统一 12px（section gap ≤ 16px），主趋势行吃掉剩余高度避免底部空白 */
        .ov-row {
            flex-shrink: 0;
            margin-bottom: 12px;
        }

        .ov-row-main {
            flex: 1 1 auto;
            min-height: 300px;
        }

        .ov-row-main .arco-card {
            height: 100%;
        }

        .ov-row-main .arco-card-body {
            display: flex;
            flex-direction: column;
        }

        .ov-trend {
            flex: 1 1 auto;
            min-height: 240px;
            width: 100%;
        }

        /* 卡片头：图标 + 标题 + 副标题 | 右侧附加信息 */
        .ov-card > .arco-card-header {
            padding: 10px 16px !important;
        }

        .ov-card > .arco-card-body {
            padding: 12px 16px !important;
        }

        .ov-card-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            width: 100%;
            min-width: 0;
        }

        .ov-card-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            color: var(--color-text-1);
            white-space: nowrap;
        }

        .ov-card-sub {
            font-size: 12px;
            font-weight: 400;
            color: var(--color-text-3);
        }

        .ov-card-extra {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: var(--color-text-3);
            white-space: nowrap;
        }

        /* 状态点：运行=绿 / 扫描与连接中=蓝 / 暂停=灰 / 异常=红 */
        .ov-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .ov-dot--running, .ov-dot--connected {
            background-color: #00B42A;
            animation: breathe 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        .ov-dot--scanning, .ov-dot--connecting {
            background-color: #165DFF;
            animation: pulse 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        .ov-dot--paused, .ov-dot--idle {
            background-color: #86909C;
        }

        .ov-dot--disconnected {
            background-color: #F53F3F;
            animation: flash-warning 1.5s ease-in-out infinite;
        }

        /* ① 全局操作栏：左=运行状态摘要，右=主操作 / 次操作 / 更多 */
        .ov-topbar {
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .ov-runstate {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            flex-wrap: wrap;
        }

        .ov-runstate-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--color-text-1);
        }

        .ov-runstate-meta {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: var(--color-text-3);
        }

        .ov-runstate-meta b {
            color: var(--color-text-2);
            font-weight: 600;
        }

        .ov-meta-divider {
            width: 1px;
            height: 10px;
            background: var(--glass-border);
        }

        .ov-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ov-dopt-danger {
            color: #F53F3F;
        }

        /* ② 实时状态摘要 Stats Bar（单条容器，高度 ~64px） */
        .ov-statsbar {
            flex-shrink: 0;
            display: flex;
            align-items: stretch;
            background-color: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            margin-bottom: 12px;
        }

        .ov-stat {
            flex: 1 1 0;
            min-width: 0;
            padding: 10px 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 2px;
            border-left: 1px solid var(--glass-border);
        }

        .ov-stat:first-child {
            border-left: none;
        }

        .ov-stat-label {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: var(--color-text-3);
            white-space: nowrap;
        }

        .ov-stat-value {
            font-size: 20px;
            font-weight: 600;
            line-height: 1.25;
            color: var(--color-text-1);
            white-space: nowrap;
        }

        .ov-speed-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 3px 10px;
            border: 1px solid var(--glass-border);
            border-radius: 999px;
            font-size: 12px;
            color: var(--color-text-3);
        }

        .ov-speed-chip b {
            color: #165DFF;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        /* 磁盘空间：剩余概览 + TOP5 细进度条（3px） */
        .ov-disk-free b {
            color: var(--color-text-1);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .ov-disk-warn {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 10px;
            padding: 6px 10px;
            border-radius: 6px;
            background: rgba(255, 125, 0, 0.1);
            color: #FF7D00;
            font-size: 12px;
        }

        .ov-rank {
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow: auto;
        }

        .ov-rank-row {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .ov-rank-line {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            font-size: 13px;
        }

        .ov-rank-name {
            display: flex;
            align-items: baseline;
            gap: 8px;
            min-width: 0;
        }

        .ov-rank-idx {
            font-size: 11px;
            color: var(--color-text-4);
            font-family: 'SF Mono', Consolas, Menlo, monospace;
        }

        .ov-rank-text {
            font-weight: 500;
            color: var(--color-text-1);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .ov-rank-size {
            font-weight: 600;
            color: var(--color-text-2);
            font-variant-numeric: tabular-nums;
        }

        .ov-rank-bar {
            height: 3px;
            border-radius: 2px;
            background: var(--color-fill-2);
            overflow: hidden;
        }

        .ov-rank-bar i {
            display: block;
            height: 100%;
            border-radius: 2px;
        }

        .ov-rank-foot {
            margin-top: 2px;
            padding-top: 8px;
            border-top: 1px dashed var(--glass-border);
            font-size: 12px;
            color: var(--color-text-3);
            text-align: right;
        }

        .ov-rank-foot b {
            color: var(--color-text-1);
            font-weight: 600;
        }

        /* ④ 上传任务：四个指标一组 + 任务分布环图 / 空状态 */
        .ov-taskbody {
            display: flex;
            align-items: stretch;
            gap: 16px;
            min-height: 132px;
        }

        .ov-taskstats {
            flex: 1 1 auto;
            display: flex;
            align-items: stretch;
            min-width: 0;
        }

        .ov-taskstat {
            flex: 1 1 0;
            min-width: 0;
            padding: 4px 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 3px;
            border-left: 1px solid var(--glass-border);
        }

        .ov-taskstat:first-child {
            border-left: none;
            padding-left: 4px;
        }

        .ov-taskstat-value {
            font-size: 24px;
            font-weight: 600;
            line-height: 1.2;
            white-space: nowrap;
        }

        .ov-taskstat-sub {
            font-size: 11px;
            color: var(--color-text-3);
        }

        .ov-donut {
            flex: 0 0 168px;
            min-height: 132px;
        }

        /* 上传任务卡：右列（扫描与系统状态）更高时，任务内容在卡内垂直居中，避免底部留白 */
        .ov-card--task {
            display: flex;
            flex-direction: column;
        }

        .ov-card--task > .arco-card-body {
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .ov-empty {
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            padding: 16px;
            color: var(--color-text-3);
            text-align: center;
        }

        .ov-empty-title {
            margin: 0;
            font-size: 13px;
            font-weight: 500;
            color: var(--color-text-2);
        }

        .ov-empty-sub {
            margin: 0;
            font-size: 12px;
        }

        /* 扫描与系统状态：三个紧凑信息块 */
        .ov-sysblock + .ov-sysblock {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed var(--glass-border);
        }

        .ov-syshead {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .ov-sysname {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-size: 13px;
            font-weight: 500;
            color: var(--color-text-1);
        }

        .ov-systag {
            padding: 1px 8px;
            border-radius: 999px;
            font-size: 11px;
            color: #165DFF;
            background: rgba(22, 93, 255, 0.08);
            cursor: default;
            white-space: nowrap;
        }

        .ov-systag--green {
            color: #00B42A;
            background: rgba(0, 180, 42, 0.08);
        }

        body[arco-theme='dark'] .ov-systag {
            color: #94BFFF;
            background: rgba(22, 93, 255, 0.2);
        }

        body[arco-theme='dark'] .ov-systag--green {
            color: #7BE188;
            background: rgba(0, 180, 42, 0.2);
        }

        .ov-sysrow {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 6px;
            font-size: 12px;
            color: var(--color-text-3);
        }

        .ov-sysrow b {
            color: var(--color-text-1);
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        /* ⑤ 目录监控 */
        .ov-section-head {
            flex-shrink: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 4px 0 10px;
        }

        .ov-section-extra {
            font-size: 12px;
            color: var(--color-text-3);
        }

        .ov-dircard-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .ov-dirpath {
            display: flex;
            align-items: flex-start;
            gap: 6px;
            min-width: 0;
            font-size: 13px;
            font-weight: 500;
            color: var(--color-text-1);
            word-break: break-all;
            line-height: 1.4;
        }

        .ov-dirstatus {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
            font-size: 12px;
            color: var(--color-text-3);
        }

        .ov-dirstats {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 8px;
            margin-top: 12px;
        }

        .ov-dirstat {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .ov-dirstat-value {
            font-size: 15px;
            font-weight: 600;
            color: var(--color-text-1);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .ov-dirfoot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-top: 12px;
            padding-top: 8px;
            border-top: 1px dashed var(--glass-border);
            font-size: 12px;
            color: var(--color-text-3);
        }

        .ov-dirnew {
            flex-shrink: 0;
            color: #165DFF;
            background: rgba(22, 93, 255, 0.08);
            padding: 1px 8px;
            border-radius: 999px;
            font-weight: 500;
        }

        body[arco-theme='dark'] .ov-dirnew {
            color: #94BFFF;
            background: rgba(22, 93, 255, 0.2);
        }

        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow-y: auto;
        }

        .login-box {
            width: 360px;
            padding: 32px;
            border: 1px solid var(--glass-border);
        }

        .arco-card {
            background: transparent !important;
            border-radius: 10px;
        }

        .arco-card-bordered {
            border: 1px solid var(--glass-border) !important;
        }

        .arco-card-header {
            border-bottom: 1px solid var(--glass-border) !important;
            padding: 6px 14px !important;
        }

        .arco-card-body {
            padding: 10px 14px !important;
        }

        .arco-layout-content, .arco-tabs-nav::before {
            background: transparent !important;
        }

        .stat-card {
            padding: 20px;
            height: 100%;
            box-sizing: border-box;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 600;
            color: var(--color-text-1);
            margin-top: 2px;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .stat-label {
            font-size: 13px;
            color: var(--color-text-3);
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .action-bar {
            margin-bottom: 10px;
            display: flex;
            gap: 8px;

        .log-container {
            padding: 16px;
            height: 420px;
            overflow-y: auto;
            font-family: 'SF Mono', Consolas, Menlo, monospace;
            font-size: 13px;
            border-radius: 12px;

        .docker-logs {
            background: #1e1e1e;
            color: #a9b7c6;
            font-family: 'Consolas', monospace;
            padding: 16px;
